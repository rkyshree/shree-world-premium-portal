
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today Best Deal</title>
    
    <!-- Loading Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; 
        }
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Iframe styling for smooth scrolling on mobile */
        .iframe-container {
            -webkit-overflow-scrolling: touch;
            overflow-y: scroll;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Header Section -->
    <header class="bg-blue-600 text-white shadow-md py-4 sticky top-0 z-50">
        <div class="container mx-auto px-4 flex justify-center items-center">
            <h1 class="text-2xl sm:text-3xl font-extrabold flex items-center tracking-wide">
                <i class="fas fa-tags mr-3 text-yellow-300"></i> Today Best Deal
            </h1>
        </div>
    </header>

    <main class="container mx-auto px-2 sm:px-4 py-6">
        
        <!-- ==========================================
             SECTION 1: HANDPICKED CUSTOM DEALS
             ========================================== -->
        <div class="mb-4 flex items-center justify-between px-2">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-800 border-l-4 border-blue-600 pl-3">🔥 Handpicked Deals</h2>
        </div>

        <!-- Deals Grid -->
        <div id="dealsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-5">
            <!-- JavaScript will automatically generate the products here -->
        </div>

        <!-- Load More Button for Custom Deals -->
        <div class="flex justify-center mt-8 mb-12">
            <button id="loadMoreBtn" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                Load More Deals <i class="fas fa-chevron-down ml-2"></i>
            </button>
        </div>

        <!-- ==========================================
             SECTION 2: LIVE DEALS (INRDEALS WIDGET)
             ========================================== -->
        <div class="mt-12 mb-4 flex items-center justify-between px-2">
            <h2 class="text-xl sm:text-2xl font-bold text-gray-800 border-l-4 border-green-500 pl-3">⚡ Live Offers & Deals</h2>
        </div>
        
        <div class="w-full bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden iframe-container p-1 sm:p-2">
            <!-- Iframe adjusted to show all products and inner 'Load More' clearly -->
            <iframe 
                src="https://inrdeals.com/embed/deals?user=arm532515116" 
                class="w-full"
                style="min-height: 1200px; height: 150vh; border:none;" 
                scrolling="yes"
                title="Live Deals">
            </iframe>
        </div>

    </main>

    <!-- Footer Section -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm font-medium">&copy; 2026 Today Best Deal. All rights reserved.</p>
        </div>
    </footer>

    <script>
        /* =================================================================================
           👇👇👇 अपना प्रोडक्ट डाटा यहाँ डालें 👇👇👇
           ================================================================================= */
           
        const DEALS_DATA = [
            { image: "https://i.ibb.co/6RwVCW5P/Picsart-26-09-03-18-16-49-601.png", link: "https://fktr.in/dE2S9Zf" },
            { image: "https://i.ibb.co/6kd2QYY/Picsart-26-09-03-17-53-06-765.png", link: "https://myntr.it/EvKvBv3" },
            { image: "https://i.ibb.co/gMk0B75b/Picsart-26-09-03-17-59-02-974.png", link: "https://ajiio.in/xgt2KkH" },
            { image: "https://i.ibb.co/SbWLZbX/Picsart-26-09-03-18-00-13-637.png", link: "https://bitli.in/lNAhep7" },
            { image: "https://i.ibb.co/XZYBtsJx/Picsart-26-09-03-18-01-09-878.png", link: "https://bitli.in/1NUgRIi" },
            { image: "https://i.ibb.co/5h76W4HN/Picsart-26-09-03-18-00-30-346.png", link: "https://bitli.in/vCZ2q0P" },
            { image: "https://i.ibb.co/hp2dVbp/Picsart-26-09-03-18-18-47-220.png", link: "https://ajiio.in/nYijE73" },
            { image: "https://i.ibb.co/5XdDfJsh/Picsart-26-09-03-18-20-24-371.png", link: "https://myntr.it/YE0Wd4o" },
            
        ];

        /* =================================================================================
           👆👆👆 अपना प्रोडक्ट डाटा यहाँ खत्म होता है 👆👆👆 
           ================================================================================= */

        // Variables for Pagination (Load More)
        const dealsGrid = document.getElementById('dealsGrid');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        let currentItemIndex = 0;
        const itemsPerLoad = 10; // एक बार में 10 प्रोडक्ट लोड होंगे (आप इसे बदल सकते हैं)

        function renderDeals() {
            if (!DEALS_DATA || DEALS_DATA.length === 0) return;

            let gridHTML = '';
            
            // Calculate how many items to show in this batch
            const endIndex = Math.min(currentItemIndex + itemsPerLoad, DEALS_DATA.length);

            // Loop through data and append
            for (let i = currentItemIndex; i < endIndex; i++) {
                const deal = DEALS_DATA[i];
                gridHTML += `
                    <div class="relative w-full rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 bg-white border border-gray-100 group">
                        <a href="${deal.link}" target="_blank" rel="noopener noreferrer" class="block w-full h-full relative cursor-pointer group">
                            
                            <!-- Product Image Area -->
                            <div class="h-44 sm:h-52 md:h-56 w-full bg-gray-50 flex items-center justify-center overflow-hidden">
                                <img 
                                    src="${deal.image}" 
                                    alt="Deal" 
                                    class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" 
                                    loading="lazy"
                                    onerror="this.src='https://placehold.co/400x400/eeeeee/999999?text=Image+Not+Found'"
                                >
                            </div>
                            
                            <!-- Click Here Button Overlay -->
                            <div class="absolute bottom-0 left-0 right-0 bg-blue-600/95 backdrop-blur-sm py-2 px-1 text-center transition-colors duration-300 group-hover:bg-blue-700">
                                <span class="text-white text-[13px] sm:text-sm font-bold flex items-center justify-center">
                                    Click Here <i class="fas fa-arrow-right ml-1 sm:ml-2 text-[10px] sm:text-xs"></i>
                                </span>
                            </div>
                        </a>
                    </div>
                `;
            }

            // Append new items to the grid
            dealsGrid.innerHTML += gridHTML;
            
            // Update current index
            currentItemIndex = endIndex;

            // Show or Hide "Load More" button depending on remaining items
            if (currentItemIndex >= DEALS_DATA.length) {
                loadMoreBtn.classList.add('hidden');
                loadMoreBtn.classList.remove('flex');
            } else {
                loadMoreBtn.classList.remove('hidden');
                loadMoreBtn.classList.add('flex');
            }
        }

        // Add event listener to the Load More button
        loadMoreBtn.addEventListener('click', renderDeals);

        // Render first batch of deals on page load
        document.addEventListener('DOMContentLoaded', renderDeals);

    </script>
</body>
</html>
