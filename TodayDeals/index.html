<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today Best Deal</title>
    
    <!-- Loading Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; 
        }
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-blue-600 text-white shadow-md py-4 sticky top-0 z-50">
        <div class="container mx-auto px-4 flex justify-center items-center">
            <h1 class="text-2xl sm:text-3xl font-extrabold flex items-center tracking-wide">
                <i class="fas fa-tags mr-3 text-yellow-300"></i> Today Best Deal
            </h1>
        </div>
    </header>

    <main class="container mx-auto px-2 sm:px-4 py-6">
        
        <!-- Deals Grid: 2 columns on mobile, 3 on tablet, 4 on desktop, 5 on large screens -->
        <div id="dealsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-5">
            <!-- JavaScript will automatically generate the products here -->
        </div>

    </main>

    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm font-medium">&copy; 2026 Today Best Deal. All rights reserved.</p>
        </div>
    </footer>

    <script>
        /* =================================================================================
           👇👇👇 अपना प्रोडक्ट डाटा यहाँ डालें 👇👇👇
           
           आप इस लिस्ट (DEALS_DATA) में जितने चाहें उतने प्रोडक्ट डाल सकते हैं (100, 1000+)।
           बस आपको हर प्रोडक्ट के लिए नीचे दिए गए फॉर्मेट में { image: "...", link: "..." }, कॉपी-पेस्ट करना है।
           ================================================================================= */
           
        const DEALS_DATA = [
            {
                image: "https://earnkaro.com/upto-50-off-on-top-beauty-brands/PPS14-Flash-Nykaa-catcard-104",
                link: "https://bitli.in/5nmB2fX"
            },
            {
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&q=80",
                link: "https://your-affiliate-link.com/watch"
            },
            {
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&q=80",
                link: "https://your-affiliate-link.com/shoes"
            },
            {
                image: "https://images.unsplash.com/photo-1583394838336-acd977736f90?w=500&q=80",
                link: "https://your-affiliate-link.com/earbuds"
            },
            {
                image: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&q=80",
                link: "https://your-affiliate-link.com/camera"
            },
            {
                image: "https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=500&q=80",
                link: "https://your-affiliate-link.com/bag"
            },
            {
                image: "https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=500&q=80",
                link: "https://your-affiliate-link.com/perfume"
            },
            {
                image: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500&q=80",
                link: "https://your-affiliate-link.com/smartwatch2"
            },
            {
                image: "https://images.unsplash.com/photo-1598327105666-5b89351cb31b?w=500&q=80",
                link: "https://your-affiliate-link.com/speaker"
            },
            {
                image: "https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb?w=500&q=80",
                link: "https://your-affiliate-link.com/headphones2"
            }
            /* 
               यहाँ और प्रोडक्ट जोड़ने के लिए ऊपर वाले को कॉपी करें और नीचे पेस्ट करते जाएँ:
               , {
                   image: "नया फोटो लिंक यहाँ डालें",
                   link: "नया एफिलिएट लिंक यहाँ डालें"
               }
            */
        ];

        /* =================================================================================
           👆👆👆 अपना प्रोडक्ट डाटा यहाँ खत्म होता है 👆👆👆 
           ================================================================================= */


        const dealsGrid = document.getElementById('dealsGrid');

        function renderDeals() {
            // अगर लिस्ट खाली है तो कुछ नहीं करेंगे
            if (!DEALS_DATA || DEALS_DATA.length === 0) return;

            let gridHTML = '';

            DEALS_DATA.forEach((deal) => {
                gridHTML += `
                    <div class="relative w-full rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 bg-white border border-gray-100 group">
                        <a href="${deal.link}" target="_blank" rel="noopener noreferrer" class="block w-full h-full relative cursor-pointer group">
                            
                            <!-- Product Image Area -->
                            <div class="h-44 sm:h-52 md:h-56 w-full bg-gray-50 flex items-center justify-center overflow-hidden">
                                <img 
                                    src="${deal.image}" 
                                    alt="Deal" 
                                    class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" 
                                    loading="lazy"
                                    onerror="this.src='https://placehold.co/400x400/eeeeee/999999?text=Image+Not+Found'"
                                >
                            </div>
                            
                            <!-- Click Here Button Overlay -->
                            <div class="absolute bottom-0 left-0 right-0 bg-blue-600/95 backdrop-blur-sm py-2 px-1 text-center transition-colors duration-300 group-hover:bg-blue-700">
                                <span class="text-white text-[13px] sm:text-sm font-bold flex items-center justify-center">
                                    Click Here <i class="fas fa-arrow-right ml-1 sm:ml-2 text-[10px] sm:text-xs"></i>
                                </span>
                            </div>
                        </a>
                    </div>
                `;
            });

            // एक साथ सारे कार्ड्स को ग्रिड में डाल दें (ताकि वेबसाइट फ़ास्ट रहे)
            dealsGrid.innerHTML = gridHTML;
        }

        document.addEventListener('DOMContentLoaded', renderDeals);

    </script>
</body>
</html>
