<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | SHREE WORLD PREMIUM PORTAL</title>
<link rel="icon" href="icon-192.png">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0f172a;
  color: white;
}

.header {
  background: #1d4ed8;
  padding: 18px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

.container {
  max-width: 500px;
  margin: 20px auto;
  padding: 15px;
}

.card {
  background: #1e293b;
  border-radius: 18px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,.35);
}

#customerPhoto {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 4px solid #facc15;
  object-fit: cover;
  margin-bottom: 15px;
}

h2 {
  margin-bottom: 8px;
}

p {
  color: #cbd5e1;
  margin-bottom: 10px;
}

.info {
  background: #334155;
  padding: 14px;
  border-radius: 10px;
  margin-top: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.editBtn {
  background: #8b5cf6;
  color: white;
}

.copyBtn {
  background: #2563eb;
  color: white;
}

.trackBtn {
  background: #16a34a;
  color: white;
}

.orderBtn {
  background: #f59e0b;
  color: white;
}

.logoutBtn {
  background: #dc2626;
  color: white;
}
</style>
</head>

<body>

<div class="header">
  👤 My Profile
</div>

<div class="container">
  <div class="card">
    <img id="customerPhoto" src="icon-192.png" alt="Profile">
    
    <h2 id="customerName">Loading...</h2>
    <p id="customerEmail">Loading...</p>

    <div class="info">
      💰 Wallet : <span id="customerWallet">₹0</span>
    </div>

    <!-- Mobile Number Section Added Here -->
    <div class="info">
      📱 Mobile : <b id="customerMobile">Not Added</b>
    </div>

    <div class="info">
      🎁 Referral Code : <b id="customerReferral">Loading...</b>
    </div>

    <!-- Buttons -->
    <button class="editBtn" onclick="editProfile()">
      ✏️ Edit Mobile
    </button>

    <button class="copyBtn" onclick="copyReferral()">
      📋 Copy Referral Code
    </button>

    <button class="orderBtn" onclick="window.location.href='order-history.html'">
      📦 My Orders
    </button>

    <button class="trackBtn" onclick="window.location.href='track-order.html'">
      🚚 Track Order
    </button>

    <button class="logoutBtn" onclick="customerLogout()">
      🚪 Logout
    </button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

// updateDoc added to Firestore imports
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOMp4Z4XncCXCLiKb3OwsqkAMe2oFSd2I",
  authDomain: "rkyshree-2f74b.firebaseapp.com",
  projectId: "rkyshree-2f74b",
  storageBucket: "rkyshree-2f74b.firebasestorage.app",
  messagingSenderId: "354823113610",
  appId: "1:354823113610:web:d043805305c945339c9673",
  measurementId: "G-WSXGTGFWYK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ================= LOAD CUSTOMER PROFILE =================
async function loadProfile(user) {
  try {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);

    if (snap.exists()) {
      const data = snap.data();
      
      document.getElementById("customerPhoto").src = data.photo || "icon-192.png";
      document.getElementById("customerName").innerText = data.name || "Customer";
      document.getElementById("customerEmail").innerText = data.email || "";
      document.getElementById("customerWallet").innerText = "₹" + (data.wallet || 0);
      
      // Mobile Number Fetching Added Here
      document.getElementById("customerMobile").innerText = data.mobile || "Not Added";
      
      document.getElementById("customerReferral").innerText = data.referralCode || "Not Available";
    } else {
      alert("Profile Data Not Found");
    }
  } catch (error) {
    console.log(error);
    alert("Profile Load Failed");
  }
}

// ================= AUTO LOGIN CHECK =================
onAuthStateChanged(auth, (user) => {
  if (user) {
    loadProfile(user);
  } else {
    window.location.href = "customer-login.html";
  }
});

// ================= COPY REFERRAL =================
window.copyReferral = function() {
  const code = document.getElementById("customerReferral").innerText;
  navigator.clipboard.writeText(code);
  alert("✅ Referral Code Copied");
};

// ================= SHARE REFERRAL =================
window.shareReferral = function() {
  const code = document.getElementById("customerReferral").innerText;
  const link = "https://www.rkyshree.in/?ref=" + code;
  if (navigator.share) {
    navigator.share({
      title: "SHREE WORLD PREMIUM PORTAL",
      text: "Join SHREE WORLD PREMIUM PORTAL",
      url: link
    });
  } else {
    navigator.clipboard.writeText(link);
    alert("Referral Link Copied");
  }
};

// ================= EDIT PROFILE (MOBILE) =================
window.editProfile = async function() {
  const user = auth.currentUser;
  
  if (!user) {
    alert("Please Login Again");
    return;
  }

  const mobile = prompt(
    "Enter Mobile Number",
    document.getElementById("customerMobile")?.innerText !== "Not Added" 
      ? document.getElementById("customerMobile").innerText 
      : ""
  );

  if (mobile == null || mobile.trim() === "") return;

  try {
    // Uses updateDoc which is now successfully imported
    await updateDoc(doc(db, "users", user.uid), {
      mobile: mobile
    });

    if (document.getElementById("customerMobile")) {
      document.getElementById("customerMobile").innerText = mobile;
    }
    
    alert("✅ Profile Updated Successfully");
  } catch (error) {
    console.log(error);
    alert(error.message);
  }
};

// ================= LOGOUT =================
window.customerLogout = async function() {
  try {
    await signOut(auth);
    localStorage.clear();
    alert("Logout Successful");
    window.location.href = "customer-login.html";
  } catch (error) {
    alert(error.message);
  }
};

// ================= PAGE READY =================
window.addEventListener("load", () => {
  console.log("Profile Page Loaded");
});

// ================= END SCRIPT =================
</script>
</body>
</html>
