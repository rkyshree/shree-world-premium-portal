/* =====================================
FILE INPUT
===================================== */

function fileInput(
id,
multiple=false,
accept="*/*"
){

return `

<div class="field">

<label>
File चुनें
</label>

<input
id="${id}"
type="file"
${multiple?"multiple":""}
accept="${accept}">

</div>

`;

}


/* =====================================
DOWNLOAD
===================================== */

function downloadBlob(
blob,
filename
){

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=filename;

a.click();

setTimeout(
()=>URL.revokeObjectURL(url),
1000
);

}

/* =====================================
IMAGE PROCESS
===================================== */

async function processImage(name){

const file=
document.getElementById(
"imageFile"
).files[0];

if(!file){

alert("पहले image चुनें");

return;

}

const reader=
new FileReader();

reader.onload=function(){

const image=
new Image();

image.onload=function(){

let canvas=
document.createElement("canvas");

let ctx=
canvas.getContext("2d");

let width=image.width;

let height=image.height;


if(name==="Image Resizer"){

width=
Number(
document.getElementById(
"newWidth"
).value
)||width;

height=
Number(
document.getElementById(
"newHeight"
).value
)||height;

}


if(
name==="Image Rotate" &&
(
document.getElementById(
"rotate"
).value==="90" ||
document.getElementById(
"rotate"
).value==="270"
)
){

canvas.width=height;

canvas.height=width;

ctx.translate(
canvas.width/2,
canvas.height/2
);

ctx.rotate(
Number(
document.getElementById(
"rotate"
).value
)
*Math.PI/180
);

ctx.drawImage(
image,
-width/2,
-height/2,
width,
height
);

}

else{

canvas.width=width;

canvas.height=height;

ctx.drawImage(
image,
0,
0,
width,
height
);

}


/* WATERMARK */

if(name==="Image Watermark"){

ctx.font=
"bold 32px Arial";

ctx.fillStyle=
"rgba(255,0,0,.55)";

ctx.fillText(
document.getElementById(
"imageWatermark"
).value,
20,
height-30
);

}


let quality=
name==="Image Compressor"
?
Number(
document.getElementById(
"quality"
).value
)
:
.92;


let type="image/jpeg";

let extension="jpg";


if(name==="Image to PNG"){

type="image/png";

extension="png";

}

if(name==="Image to WebP"){

type="image/webp";

extension="webp";

}


canvas.toBlob(

blob=>{

downloadBlob(
blob,
`image.${extension}`
);

},

type,
quality

);

};

image.src=
reader.result;

};

reader.readAsDataURL(file);

}

async function mergePDF(){

document.getElementById(
"files"
).files;

if(!files.length){

return;

}

const output=
await PDFLib.PDFDocument.create();

for(
const file of files
){

const pdf=
await PDFLib.PDFDocument.load(
await file.arrayBuffer()
);

const pages=
await output.copyPages(
pdf,
pdf.getPageIndices()
);

pages.forEach(
page=>output.addPage(page)
);

}

const bytes=
await output.save();

downloadBlob(
new Blob(
[bytes],
{type:"application/pdf"}
),
"merged.pdf"
);

}


/* =====================================
PDF SPLIT
===================================== */

async function splitPDF(){

const file=
document.getElementById(
"files"
).files[0];

if(!file)return;

const pdf=
await PDFLib.PDFDocument.load(
await file.arrayBuffer()
);

const input=
document.getElementById(
"pages"
).value;

const indexes=[];

input.split(",")
.forEach(part=>{

if(part.includes("-")){

let [
start,
end
]=part.split("-")
.map(Number);

for(
let i=start;
i<=end;
i++
){

indexes.push(i-1);

}

}

else{

indexes.push(
Number(part)-1
);

}

});


const output=
await PDFLib.PDFDocument.create();

const pages=
await output.copyPages(
pdf,
indexes.filter(
i=>i>=0 &&
i<pdf.getPageCount()
)
);

pages.forEach(
p=>output.addPage(p)
);

downloadBlob(

new Blob(
[
await output.save()
],
{
type:"application/pdf"
}
),

"split.pdf"

);

}

function processText(name){

const text=
document.getElementById(
"textInput"
).value;

let result="";


if(name==="Word Counter"){

const words=
text.trim()
?
text.trim()
.split(/\s+/)
.length
:
0;

"Words: "+
words+
"\nCharacters: "+
text.length;

result=
"Characters: "+
text.length;

}


if(name==="Case Converter"){

result=

"UPPERCASE:\n"+
text.toUpperCase()+

"\n\nlowercase:\n"+
text.toLowerCase()+

"\n\nTitle Case:\n"+
text
.toLowerCase()
.replace(
/\b\w/g,
c=>c.toUpperCase()
);

}


if(name==="Duplicate Line Remover"){

result=
[
...new Set(
text.split(/\r?\n/)
)
]
.join("\n");

}


if(name==="Text Sorter"){

result=
text
.split(/\r?\n/)
.filter(Boolean)
.sort()
.join("\n");

}


document.getElementById(
"output"
).textContent=
result;

}

/* =====================================

let stopwatchInterval;

function startStopwatch(){

if(stopwatchInterval)
return;

stopwatchInterval=
setInterval(
()=>{

stopwatchSeconds++;

let h=
String(
Math.floor(
stopwatchSeconds/3600
)
).padStart(2,"0");

let m=
String(
Math.floor(
(stopwatchSeconds%3600)/60
)
).padStart(2,"0");

let s=
String(
stopwatchSeconds%60
).padStart(2,"0");

document.getElementById(
"stopwatch"
).textContent=
`${h}:${m}:${s}`;

},
1000
);

}


function stopStopwatch(){

clearInterval(
stopwatchInterval
);

stopwatchInterval=null;

}


function resetStopwatch(){

stopStopwatch();

stopwatchSeconds=0;

document.getElementById(
"stopwatch"
).textContent=
"00:00:00";

}

/* =====================================
HELPERS
===================================== */

function readFile(file){

return new Promise(
(resolve,reject)=>{

const reader=
new FileReader();

reader.onload=
()=>resolve(
reader.result
);

reader.onerror=
reject;

reader.readAsDataURL(file);

});

}


function loadImage(src){

return new Promise(
(resolve,reject)=>{

const img=
new Image();

img.onload=
()=>resolve(img);

img.onerror=
reject;

img.src=src;

});

}


function escapeHTML(text){

return String(
text||""
)
.replace(
/[&<>"']/g,

function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m];

}
);

}
