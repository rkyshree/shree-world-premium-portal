<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>

body{
background:#f5f5f5;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{

background:white;
padding:30px;
width:350px;
border-radius:15px;
box-shadow:0px 5px 20px rgba(0,0,0,.2);

}

input{

width:100%;
padding:12px;
margin:10px 0;

}

button{

width:100%;
padding:12px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
cursor:pointer;

}

</style>

</head>

<body>

<div class="box">

<h2 align="center">Admin Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button>Login</button>

</div>

</body>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOMp4Z4XncCXCLiKb3OwsqkAMe2oFSd2I",
  authDomain: "rkyshree-2f74b.firebaseapp.com",
  projectId: "rkyshree-2f74b",
  storageBucket: "rkyshree-2f74b.firebasestorage.app",
  messagingSenderId: "354823113610",
  appId: "1:354823113610:web:d043805305c945339c9673",
  measurementId: "G-WSXGTGFWYK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.querySelector("button").addEventListener("click", () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)
    .then(() => {
      alert("Login Successful");
      window.location.href = "dashboard.html";
    })
    .catch((error) => {
      alert(error.message);
    });
});
</script>
</html>
