/* =========================================================

html { scroll-behavior:smooth; -webkit-tap-highlight-color:transparent; }

/* SPLASH SCREEN */

.splash-bg { position:absolute; inset:-30%; background: radial-gradient(circle at 50% 40%, rgba(59,130,246,.24), transparent 25%), radial-gradient(circle at 20% 80%, rgba(168,85,247,.18), transparent 30%), radial-gradient(circle at 90% 20%, rgba(236,72,153,.14), transparent 28%), #080b12; animation: splashBackground 5s ease-in-out infinite alternate; will-change: transform; transform: translateZ(0); }
@keyframes splashBackground { from { transform:scale(1) translateZ(0); } to { transform:scale(1.06) translateZ(0); } }
.splash-content { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; animation: splashContent .4s cubic-bezier(.16,1,.3,1); will-change: transform, opacity; }
@keyframes splashContent { from { opacity:0; transform: translateY(10px) scale(.98); } to { opacity:1; transform: translateY(0) scale(1); } }
.splash-logo-wrap { position:relative; width:105px; height:105px; display:flex; align-items:center; justify-content:center; margin-bottom:22px; }
.splash-ring { position:absolute; inset:0; border-radius:50%; border:2px solid rgba(255,255,255,.08); border-top-color:#3b82f6; border-right-color:#a855f7; animation: splashRotate 1.2s linear infinite; }
@keyframes splashRotate { to { transform:rotate(360deg); } }
.splash-logo { width:78px; height:78px; object-fit:cover; border-radius:50%; background:#fff; padding:3px; box-shadow: 0 0 25px rgba(59,130,246,.35), 0 0 60px rgba(168,85,247,.20); animation: splashLogoPulse 1.3s ease-in-out infinite alternate; }
@keyframes splashLogoPulse { from { transform:scale(.97); } to { transform:scale(1.03); } }
.splash-title { margin:0; color:#fff; font-family:"Outfit",sans-serif; font-size:30px; font-weight:900; letter-spacing:4px; text-shadow: 0 0 20px rgba(255,255,255,.12); }
.splash-subtitle { margin-top:8px; color:rgba(255,255,255,.50); font-size:8px; font-weight:700; letter-spacing:2px; }
.splash-loader { display:flex; gap:6px; margin-top:25px; }
.splash-loader span { width:6px; height:6px; border-radius:50%; background:#fff; opacity:.25; animation: splashDots 1.2s infinite ease-in-out; }
.splash-loader span:nth-child(2) { animation-delay:.15s; }
.splash-loader span:nth-child(3) { animation-delay:.30s; }
@keyframes splashDots { 0%,60%,100% { opacity:.25; transform:scale(.8); } 30% { opacity:1; transform:scale(1.2); } }
.splash-bottom { position:absolute; bottom: calc(25px + env(safe-area-inset-bottom)); left:0; right:0; z-index:3; text-align:center; font-size:7px; letter-spacing:2px; color:rgba(255,255,255,.30); }
.splash-bottom strong { display:block; margin-top:5px; color:rgba(255,255,255,.65); font-size:9px; letter-spacing:3px; }

/* APP WRAPPER */
.app-wrapper { width:100%; max-width:480px; margin:0 auto; background:#f8fafc; background-image: linear-gradient(180deg, #ffffff 0%, #f1f5f9 20%, #e2e8f0 100%); min-height:100dvh; position:relative; box-shadow: 0 0 40px rgba(0,0,0,.1); overflow-x:hidden; display:flex; flex-direction:column; }
.app-header { position:sticky; top:0; z-index:50; background: rgba(255,255,255,.65); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom: 1px solid rgba(255,255,255,.4); display:flex; align-items:center; justify-content:space-between; padding: 12px 20px; padding-top: calc(12px + env(safe-area-inset-top)); box-shadow: 0 4px 30px rgba(0,0,0,.03); transform: translateZ(0); }

/* GLASS CARD */
.glass-card { background: rgba(255,255,255,.55); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border: 1px solid rgba(255,255,255,.8); box-shadow: 0 10px 30px rgba(0,0,0,.03); border-radius:20px; transition: transform .1s ease; transform: translateZ(0); }

/* ANIMATIONS */
@keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
@keyframes scaleIn { from { transform:scale(.97); opacity:0; } to { transform:scale(1); opacity:1; } }
.job-blink { animation: softBlink 1.8s infinite alternate ease-in-out; will-change: transform, box-shadow; }
@keyframes softBlink { 0% { box-shadow: 0 4px 15px rgba(236,72,153,.15); transform:translateY(0); } 100% { box-shadow: 0 10px 25px rgba(236,72,153,.5); transform:translateY(-2px); } }
.app-btn:active, .glass-card:active { transform:scale(.96); transition: transform .05s ease; }

/* PAGES */

<!-- =========================================================
     JAVASCRIPT SETTINGS & LOGIC
========================================================= -->
<script>
/* SPLASH TIMER REDUCED FOR SPEED = 1000ms */
const SPLASH_MIN_TIME = 1000;
let splashStartTime = performance.now();
let splashHidden = false;

/* =========================================================
   MASTER CONFIGURATION
========================================================= */
const CONFIG = {
    profileImage: "https://i.ibb.co/KxBGzbvK/1000676725-optimized-1000.png",
    websiteUrl: "https://www.rkyshree.in/",
    whatsappHelpline: "9451239239",
    shareTitle: "SHRAYNEX | Social Media Management",
    shareText: "🚀 SHRAYNEX — आपके बिज़नेस की डिजिटल ग्रोथ का साथी!\n\n📱 सोशल मीडिया मैनेजमेंट\n💻 वेब डेवलपमेंट\n📈 डिजिटल मार्केटिंग\n\n🌐 अभी विज़िट करें 👇",

    heroTools: [
        { icon:"fas fa-chart-line", link:"https://www.rkyshree.in/growth", label:"Growth", color:"#3b82f6" },
        { icon:"fas fa-wand-magic-sparkles", link:"https://www.rkyshree.in/Tools", label:"Tools Hub", color:"#a855f7" },
        { icon:"fas fa-code", link:"https://www.rkyshree.in/Edvynox", label:"Web Dev", color:"#10b981" },
        { icon:"fas fa-briefcase", link:"https://www.rkyshree.in/Job", label:"Job", color:"#ec4899" },
        // New Free Tools added as rounded circles in grid
        { icon:"fas fa-gift", link:"https://www.rkyshree.in/FreePoster", label:"Free Poster", color:"#eab308" },
        { icon:"fas fa-book-open", link:"https://www.rkyshree.in/Book", label:"Free Book", color:"#f97316" }
    ]
};

/* =========================================================
   SERVICE WORKER & FAST LOADER
========================================================= */
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js", { scope:"/" }).catch(() => {});
    });
}

// BFCache (Back Forward Cache) Fix
window.addEventListener("pageshow", (e) => {
    if (e.persisted) {
        const loader = document.getElementById("appLoader");
        if(loader) loader.classList.add("hide");
        splashHidden = true;
    }
});

function hideLoader(){
    if(splashHidden) return;
    const loader = document.getElementById("appLoader");
    if(!loader) return;
    const elapsed = performance.now() - splashStartTime;
    const remaining = Math.max(0, SPLASH_MIN_TIME - elapsed);

    setTimeout(() => {
        if(splashHidden) return;
        splashHidden = true;
        loader.classList.add("hide");
        setTimeout(() => loader.setAttribute("aria-hidden", "true"), 300);
    }, remaining);
}

document.addEventListener("DOMContentLoaded", () => {
    // Non-blocking initialization for speed
    setTimeout(() => {
        attachLinkLoaders();
        generateLayout();
        hideLoader();
    }, 0);
});
setTimeout(() => hideLoader(), SPLASH_MIN_TIME + 50);

/* =========================================================
   FAST LINK LOADER (NO DELAY)
========================================================= */
function attachLinkLoaders(){
    document.querySelectorAll("a").forEach(link => {
        if(link.dataset.loaderAttached) return;
        link.dataset.loaderAttached = "true";
        link.addEventListener("click", function(e){
            const href = this.getAttribute("href");
            const target = this.getAttribute("target");
            if(!href || href === "#" || href.startsWith("javascript:") || this.hasAttribute("download") || target === "_blank") return;
            try{
                const url = new URL(href, window.location.href);
                if(url.origin !== window.location.origin) return;
                e.preventDefault();
                const loader = document.getElementById("appLoader");
                if(loader){
                    loader.classList.remove("hide");
                    loader.setAttribute("aria-hidden", "false");
                    splashHidden = false;
                    splashStartTime = performance.now();
                }
                setTimeout(() => window.location.href = url.href, 10);
            } catch(error) {}
        });
    });
}

// Basic Data Population
const profileImg = document.getElementById("profileImage");
if(profileImg) profileImg.src = CONFIG.profileImage;
const fWaLink = document.getElementById("footerWaLink");
if(fWaLink) fWaLink.href = `https://wa.me/91${CONFIG.whatsappHelpline}`;

async function copyText(text, button){
    try{
        if(navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
        } else {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed"; textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus(); textarea.select(); document.execCommand("copy");
            textarea.remove();
        }
        if(button){
            const original = button.innerText;
            button.innerText = "Copied!";
            button.classList.add("bg-green-100", "text-green-700");
            setTimeout(() => {
                button.innerText = original;
                button.classList.remove("bg-green-100", "text-green-700");
            }, 1500);
        }
    } catch(e) { alert("Copy failed."); }
}

// Generate Tools Layout
function generateLayout(){
    const tools = document.getElementById("bottomToolsContainer");
    if(!tools) return;

    // 3 column grid for all 6 tools
    let toolsHtml = `<div class="grid grid-cols-3 gap-3">`;
    CONFIG.heroTools.forEach(t => {
        toolsHtml += `<a href="${t.link}" class="glass-card flex flex-col items-center gap-2 group p-4">
            <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-white/60 backdrop-blur-md border border-white/80 shadow-sm">
                <i class="${t.icon} text-xl" style="color:${t.color}"></i>
            </div>
            <span class="text-[10px] font-black text-gray-700 text-center uppercase tracking-wider">${t.label}</span>
        </a>`;
    });
    toolsHtml += `</div>`;
    tools.innerHTML = toolsHtml;
}

async function shareWebsite(){
    const d = { title: CONFIG.shareTitle, text: CONFIG.shareText, url: CONFIG.websiteUrl };
    try{
        if(navigator.share) { await navigator.share(d); return; }
        await copyText(CONFIG.websiteUrl, null);
        alert("Website link copy हो गया है। अब आप इसे WhatsApp या किसी भी app पर share कर सकते हैं।");
    } catch(e) {}
}
document.getElementById("topShareBtn")?.addEventListener("click", shareWebsite);

document.addEventListener("error", function(e){
    if(e.target && e.target.tagName === "IMG"){
        e.target.style.background = "#e2e8f0";
        e.target.style.objectFit = "contain";
    }
}, true);

/* =========================================================
   PWA INSTALLATION LOGIC
========================================================= */
let deferredPrompt;
const installBtn = document.getElementById('pwaInstallBtn');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (!window.matchMedia('(display-mode: standalone)').matches && !navigator.standalone) {
        installBtn.classList.remove('hidden');
        installBtn.classList.add('flex');
    }
});

installBtn.addEventListener('click', async () => {
    installBtn.classList.add('hidden');
    installBtn.classList.remove('flex');
    
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to install: ${outcome}`);
        deferredPrompt = null;
    }
});

window.addEventListener('appinstalled', () => {
    installBtn.classList.add('hidden');
    installBtn.classList.remove('flex');
    deferredPrompt = null;
    console.log('PWA app installed successfully');
});
</script>
