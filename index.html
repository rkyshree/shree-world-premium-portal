/* SPLASH TIMER (2 seconds delay) */
const SPLASH_MIN_TIME = 2000;
let splashStartTime = performance.now();
let splashHidden = false;

/* =========================================================
   MASTER APP CONFIGURATION (Links & Services)
========================================================= */
const CONFIG = {
    websiteUrl: "https://www.rkyshree.in/",
    shareTitle: "SHRAYNEX | Start Your Reselling Business",
    shareText: "✨ SHRAYNEX — Empowering Growth!\n\n🛍️ Start Reselling from Home\n📱 Social Media Growth\n💰 Zero Investment!\n\nJoin the community now 👇",

    ]

/* =========================================================
   SERVICE WORKER & FAST LOADER
========================================================= */
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js", { scope:"/" }).catch(() => {});
    });
}

// PWA Install Logic
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const installBtn = document.getElementById("installAppBtn");
    if(installBtn) installBtn.style.display = "flex";
});

document.getElementById("installAppBtn")?.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
        document.getElementById("installAppBtn").style.display = "none";
    }
    deferredPrompt = null;
});

window.addEventListener('appinstalled', () => {
    const installBtn = document.getElementById("installAppBtn");
    if(installBtn) installBtn.style.display = "none";
    deferredPrompt = null;
});

window.addEventListener("pageshow", (e) => {
    if (e.persisted) {
        const loader = document.getElementById("appLoader");
        if(loader) loader.classList.add("hide");
        splashHidden = true;
    }
});

function hideLoader(){
    if(splashHidden) return;
    const loader = document.getElementById("appLoader");
    if(!loader) return;
    const elapsed = performance.now() - splashStartTime;
    const remaining = Math.max(0, SPLASH_MIN_TIME - elapsed);

    setTimeout(() => {
        if(splashHidden) return;
        splashHidden = true;
        loader.classList.add("hide");
        setTimeout(() => loader.style.display = "none", 400);
    }, remaining);
}

document.addEventListener("DOMContentLoaded", () => {
    // Apply Dynamic Text First
    applyDynamicText();
    
    setTimeout(() => {
        generateLayout();
        attachLinkLoaders();
        hideLoader();
    }, 0);
});
// Ensure loader stays for at least 2 seconds
setTimeout(() => hideLoader(), SPLASH_MIN_TIME + 100);

/* =========================================================
   FAST LINK LOADER
========================================================= */
function attachLinkLoaders(){
    document.querySelectorAll("a").forEach(link => {
        if(link.dataset.loaderAttached) return;
        link.dataset.loaderAttached = "true";
        link.addEventListener("click", function(e){
            const href = this.getAttribute("href");
            const target = this.getAttribute("target");
            
            if(!href || href === "#" || href.startsWith("javascript:") || this.hasAttribute("download") || target === "_blank") return;
            
            try{
                e.preventDefault();
                const loader = document.getElementById("appLoader");
                if(loader){
                    loader.style.display = "flex";
                    setTimeout(() => loader.classList.remove("hide"), 10);
                    splashHidden = false;
                    splashStartTime = performance.now();
                }
                
                setTimeout(() => window.location.href = href, 150);
            } catch(error) {}
        });
    });
}

// Generate Services Layout
function generateLayout(){
    const tools = document.getElementById("bottomToolsContainer");
    if(!tools) return;

    let toolsHtml = `<div class="grid grid-cols-2 gap-3">`;
    CONFIG.heroTools.forEach(t => {
        toolsHtml += `<a href="${t.link}" class="glass-card flex items-center p-4 gap-4 group">
            <div class="w-10 h-10 rounded-full flex shrink-0 items-center justify-center bg-white shadow-sm border border-gray-100 group-active:scale-90 transition-transform">
                <i class="${t.icon} text-lg" style="color:${t.color}"></i>
            </div>
            <div class="flex flex-col">
                <span class="text-sm font-bold text-gray-800 leading-tight">${t.label}</span>
                <span class="text-[9px] text-gray-400 font-medium uppercase tracking-wider mt-1">Access Now <i class="fas fa-angle-right ml-1"></i></span>
            </div>
        </a>`;
    });
    toolsHtml += `</div>`;
    tools.innerHTML = toolsHtml;
}

// Share Logic
async function shareWebsite(){
    const d = { title: CONFIG.shareTitle, text: CONFIG.shareText, url: CONFIG.websiteUrl };
    try{
        if(navigator.share) { await navigator.share(d); return; }
        const textarea = document.createElement("textarea");
        textarea.value = CONFIG.websiteUrl;
        document.body.appendChild(textarea);
        textarea.select(); document.execCommand("copy");
        textarea.remove();
        alert("Link copied! Share it with your friends.");
    } catch(e) {}
}
document.getElementById("topShareBtn")?.addEventListener("click", shareWebsite);
