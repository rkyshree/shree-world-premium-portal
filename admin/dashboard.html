<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:#f4f6f9;
}

.sidebar{
width:250px;
height:100vh;
background:#0d6efd;
color:white;
padding:20px;
position:fixed;
}

.sidebar h2{
margin-bottom:30px;
text-align:center;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin:8px 0;
border-radius:8px;
}

.sidebar a:hover{
background:rgba(255,255,255,.2);
}

.main{
margin-left:250px;
padding:25px;
width:100%;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:bold;
color:#0d6efd;
}

/* Select dropdown style */
select {
  padding: 6px;
  border-radius: 4px;
  border: 1px solid #ccc;
  outline: none;
  cursor: pointer;
  font-weight: bold;
  color: #0d6efd;
}

/* Table styling for better look */
th, td {
  padding: 12px;
  text-align: left;
  border-bottom: 1px solid #ddd;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>SHREE WORLD</h2>
  <a href="#">🏠 Dashboard</a>
  <a href="#">👥 Users</a>
  <a href="#">📦 Orders</a>
  <a href="#">💳 Payments</a>
  <a href="#">⭐ Reviews</a>
  <a href="#">⚙️ Settings</a>
  <a href="#" id="logout">🚪 Logout</a>
</div>

<div class="main">
  
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h1>
Admin Dashboard
<span id="notificationCount"
style="
background:red;
color:white;
padding:4px 10px;
border-radius:50%;
font-size:14px;
margin-left:10px;
">
0
</span>
</h1>
    <div onclick="readNotifications()" style="position:relative;font-size:30px;cursor:pointer;">
      🔔
      <span id="notifyCount"
      style="
      position:absolute;
      top:-8px;
      right:-8px;
      background:red;
      color:white;
      border-radius:50%;
      padding:3px 7px;
      font-size:12px;
      display:none;
      ">
      0
      </span>
    </div>
  </div>

  <p>Welcome Admin</p>

  <div class="cards">
    <div class="card">
      <h3>Total Users</h3>
      <p id="totalUsers">0</p>
    </div>

    <div class="card">
      <h3>Total Orders</h3>
      <p id="totalOrders">0</p>
    </div>

    <div class="card">
      <h3>Total Revenue</h3>
      <p id="totalRevenue">₹0</p>
    </div>

    <div class="card">
      <h3>Total Reviews</h3>
      <p id="totalReviews">0</p>
    </div>
  </div>

  <h2 style="margin-top:30px;">Recent Orders</h2>

  <table style="width:100%;margin-top:15px;background:#fff;border-collapse:collapse;box-shadow:0 3px 10px rgba(0,0,0,.1);border-radius:10px;overflow:hidden;">
    <thead style="background:#0d6efd;color:white;">
      <tr>
        <th>Name</th>
        <th>Service</th>
        <th>Amount</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="ordersBody">
      <!-- Live Orders will be injected here -->
    </tbody>
  </table>

</div> <!-- Main div closed here -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  onSnapshot,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOMp4Z4XncCXCLiKb3OwsqkAMe2oFSd2I",
  authDomain: "rkyshree-2f74b.firebaseapp.com",
  projectId: "rkyshree-2f74b",
  storageBucket: "rkyshree-2f74b.firebasestorage.app",
  messagingSenderId: "354823113610",
  appId: "1:354823113610:web:d043805305c945339c9673",
  measurementId: "G-WSXGTGFWYK"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadDashboard() {
  try {
    const users = await getDocs(collection(db, "users"));
    document.getElementById("totalUsers").innerText = users.size;

    const orders = await getDocs(collection(db, "orders"));
    document.getElementById("totalOrders").innerText = orders.size;

    let revenue = 0;
    orders.forEach((docSnap) => {
      const data = docSnap.data();
      revenue += Number(data.amount || 0);
    });
    document.getElementById("totalRevenue").innerText = "₹" + revenue.toLocaleString("en-IN");

    try {
      const reviews = await getDocs(collection(db, "reviews"));
      document.getElementById("totalReviews").innerText = reviews.size;
    } catch {
      document.getElementById("totalReviews").innerText = 0;
    }
  } catch (err) {
    console.error(err);
  }
}

function liveOrders(){
  const ordersRef = collection(db,"orders");
  
  onSnapshot(ordersRef,(snapshot)=>{
    let html="";
    let newOrders = 0;
    
    snapshot.forEach((docSnap)=>{
      const data=docSnap.data();
      
      if(data.seen==false){
        newOrders++;
      }
      
      html+=`
      <tr>
        <td>${data.name||""}</td>
        <td>${data.service||""}</td>
        <td>₹${data.amount||0}</td>
        <td>
          <select onchange="updateStatus('${docSnap.id}',this.value)">
            <option value="Pending" ${data.status=="Pending"?"selected":""}>Pending</option>
            <option value="Processing" ${data.status=="Processing"?"selected":""}>Processing</option>
            <option value="Completed" ${data.status=="Completed"?"selected":""}>Completed</option>
            <option value="Cancelled" ${data.status=="Cancelled"?"selected":""}>Cancelled</option>
          </select>
        </td>
      </tr>
      `;
    });
    
    document.getElementById("notifyCount").innerText = newOrders;

    if(newOrders > 0){
      document.getElementById("notifyCount").style.display = "block";
    } else {
      document.getElementById("notifyCount").style.display = "none";
    }
    
    document.getElementById("ordersBody").innerHTML=html;
  });
}

loadDashboard();
liveOrders();

window.updateStatus = async function(id,status){
  await updateDoc(doc(db,"orders",id),{
    status:status
  });
  alert("Status Updated");
}

window.readNotifications = async function(){
  const snapshot = await getDocs(collection(db,"orders"));
  
  snapshot.forEach(async(item)=>{
    await updateDoc(doc(db,"orders",item.id),{
      seen:true
    });
  });
}
</script>

</body>
</html>
