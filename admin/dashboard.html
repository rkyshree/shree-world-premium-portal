<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
background:#f4f6f9;
}

.sidebar{
width:250px;
height:100vh;
background:#0d6efd;
color:white;
padding:20px;
position:fixed;
}

.sidebar h2{
margin-bottom:30px;
text-align:center;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin:8px 0;
border-radius:8px;
}

.sidebar a:hover{
background:rgba(255,255,255,.2);
}

.main{
margin-left:250px;
padding:25px;
width:100%;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:bold;
color:#0d6efd;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>SHREE WORLD</h2>

<a href="#">🏠 Dashboard</a>

<a href="#">👥 Users</a>

<a href="#">📦 Orders</a>

<a href="#">💳 Payments</a>

<a href="#">⭐ Reviews</a>

<a href="#">⚙️ Settings</a>

<a href="#" id="logout">🚪 Logout</a>

</div>

<div class="main">

<h1>Admin Dashboard</h1>

<p>Welcome Admin</p>

<div class="cards">

<div class="card">
<h3>Total Users</h3>
<p>0</p>
</div>

<div class="card">
<h3>Total Orders</h3>
<p>0</p>
</div>

<div class="card">
<h3>Total Revenue</h3>
<p>₹0</p>
</div>

<div class="card">
<h3>Total Reviews</h3>
<p>0</p>
</div>

</div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadUsers() {
  const snapshot = await getDocs(collection(db, "users"));
  document.getElementById("totalUsers").innerText = snapshot.size;
}

loadUsers();
</script>
</body>
</html>
