    <style>

        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .hide-view { opacity: 0; pointer-events: none; position: absolute; width: 100%; transform: scale(0.98); visibility: hidden; }

        /* Iframe styling for Google Docs */

            width: 100%;
            height: 100%;
            border: none;

        /* Loading animation for iframe */
        .iframe-loader {

            display: flex;

            align-items: center;
            z-index: 0;

            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Book Cover Aspect Ratio */

</head>

                    <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center transition-colors shadow-inner">

                    </button>

    <!-- VIEW 1: DASHBOARD -->
    <main id="dashboardView" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full page-transition show-view">
        
        <!-- Welcome Banner -->
        <div class="relative bg-gradient-to-r from-brand-900 to-brand-700 overflow-hidden rounded-2xl shadow-xl mb-12">
            <div class="absolute inset-0 opacity-20">
                <svg class="h-full w-full" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <polygon fill="currentColor" points="0,100 100,0 100,100"/>
                </svg>
            </div>
            <div class="relative z-10 px-6 py-10 sm:px-12 sm:py-16 text-white flex flex-col sm:flex-row items-center justify-between">
                <div>
                    <h1 class="text-3xl sm:text-5xl font-extrabold mb-3 drop-shadow-md">Welcome to Shree Pathshala</h1>
                    <p class="text-brand-100 text-lg max-w-2xl">Read our premium collection of books directly from Google Docs. Fast, easy, and always updated.</p>
                </div>
                <div class="mt-6 sm:mt-0 hidden md:block text-7xl opacity-80 drop-shadow-lg transform rotate-12">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
            </div>
        </div>

        <!-- Section Title & Counter -->
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-book text-brand-600"></i> Our Library
            </h2>
            <span class="text-sm font-semibold text-brand-700 dark:text-brand-300 bg-brand-100 dark:bg-brand-900/50 px-4 py-1.5 rounded-full" id="bookCount">Loading...</span>
        </div>

        <!-- Book Grid (2 Columns on medium screens and up) -->
        <!-- User requested "2 left 2 right", which implies a 2-column layout (grid-cols-2) -->
        <div id="bookGrid" class="grid grid-cols-1 md:grid-cols-2 gap-8 pb-12">
            <!-- Books will be injected here via JavaScript -->
        </div>
    </main>

    <!-- VIEW 2: GOOGLE DOCS READER -->
    <div id="readerView" class="flex-grow w-full page-transition hide-view flex flex-col h-[calc(100vh-64px)] bg-gray-100 dark:bg-gray-950">
        
        <!-- Reader Header with Back Button -->
        <div class="bg-white dark:bg-gray-900 px-4 sm:px-6 py-3 shadow-sm z-10 flex justify-between items-center border-b border-gray-200 dark:border-gray-800 shrink-0">
            <div class="flex items-center gap-4">
                <button onclick="showDashboard()" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-md transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> <span class="hidden sm:inline">Back to Dashboard</span>
                </button>
                <div class="h-8 w-px bg-gray-300 dark:bg-gray-700 hidden sm:block"></div>
                <h2 id="readerBookTitle" class="text-lg sm:text-xl font-bold text-gray-900 dark:text-white truncate max-w-[200px] sm:max-w-md lg:max-w-2xl">
                    Book Title
                </h2>
            </div>
            <button onclick="openExternalDoc()" class="text-gray-500 hover:text-brand-600 dark:text-gray-400 dark:hover:text-brand-400 transition-colors" title="Open in new tab">
                <i class="fa-solid fa-external-link-alt text-lg"></i>
            </button>
        </div>

        <!-- Google Docs Iframe Container -->
        <div class="flex-1 w-full relative overflow-hidden">
            <!-- Loader -->
            <div id="iframeLoader" class="iframe-loader">
                <div class="spinner mb-3"></div>
                <p class="text-gray-500 dark:text-gray-400 font-medium animate-pulse">Loading Document...</p>
            </div>
            
            <!-- The Iframe -->
            <iframe 
                id="docFrame" 
                class="docs-iframe relative z-10 opacity-0 transition-opacity duration-500" 
                title="Google Docs Reader"
                onload="hideLoader()"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC & DATABASE -->
    <script>
        // ==========================================
        // 📚 DATABASE: Add your Google Docs Books Here
        // ==========================================
        const booksDatabase = [
            {
                id: "excel-master",
                title: "MS Excel Shortcut Keys",
                author: "R.K YADAV",
                tags: ["Premium", "Hindi & English"],
                // Book Poster Image URL (Can be any online image or local path like 'assets/cover1.jpg')
                coverImage: "https://i.ibb.co/kVktVDvQ/file-0000000070548208ab4b943f1b7bd3ec.png",
                description: "From Basics to Advanced. 50+ Formulas, 10 Practical Projects, Charts & Dashboards. 'Excel पढ़कर याद नहीं होता; Excel बनाकर सीखा जाता है।'",
                // Paste your Google Docs link here. The code will automatically convert it to preview mode.
                googleDocUrl: "https://docs.google.com/document/d/1cmwMyZ03acEv21pMY9n3l6ODxsekpQiX8ihsfo2TmYo/edit?usp=drivesdk" 
            },
            {
                id: "word-expert",
                title: "MS Word Expert Guide",
                author: "R.K YADAV",
                tags: ["Formatting", "Typing"],
                // Example Cover Image
                coverImage: "https://placehold.co/600x900/0369a1/ffffff?text=MS+Word\nExpert+Guide",
                description: "Master document creation, advanced formatting, mail merge, and keyboard shortcuts to become an MS Word professional.",
                // Just paste the regular Google Docs share link.
                googleDocUrl: "https://docs.google.com/document/d/1O2-N7lZpGvA5x31R1vB20s0jE1n_Qn3n3Yf0O_3-4n8/preview" // Replace with real Word doc link
            },
            {
                id: "powerpoint-pro",
                title: "PowerPoint Pro Presentations",
                author: "R.K YADAV",
                tags: ["Presentation", "Design"],
                coverImage: "https://placehold.co/600x900/b91c1c/ffffff?text=PowerPoint\nPro",
                description: "Learn how to design stunning presentations, use animations effectively, and deliver your message with impact.",
                googleDocUrl: "https://docs.google.com/document/d/1O2-N7lZpGvA5x31R1vB20s0jE1n_Qn3n3Yf0O_3-4n8/preview" // Replace with real PPT doc link
            },
            {
                id: "tally-prime",
                title: "Tally Prime Accounting",
                author: "R.K YADAV",
                tags: ["Accounting", "Business"],
                coverImage: "https://placehold.co/600x900/15803d/ffffff?text=Tally+Prime\nAccounting",
                description: "Complete guide to business accounting, inventory management, and GST taxation using Tally Prime software.",
                googleDocUrl: "https://docs.google.com/document/d/1O2-N7lZpGvA5x31R1vB20s0jE1n_Qn3n3Yf0O_3-4n8/preview" // Replace with real Tally doc link
            }
            // To add more books, just copy one of the blocks above, paste it below, and change the details!
        ];

        let currentBookUrl = "";

        // --- Initialization ---
        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            renderDashboard();
        });

        // --- Theme Management ---
        function initTheme() {
            const isDark = localStorage.getItem("sp_theme") === "dark" || 
                           (!('sp_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add("dark");
                document.getElementById("themeIcon").className = "fa-solid fa-sun text-yellow-500";
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle("dark");
            const isDark = html.classList.contains("dark");
            localStorage.setItem("sp_theme", isDark ? "dark" : "light");
            
            const icon = document.getElementById("themeIcon");
            if (isDark) {
                icon.className = "fa-solid fa-sun text-yellow-500";
            } else {
                icon.className = "fa-solid fa-moon text-gray-600";
            }
        }

        // --- Dashboard Logic ---
        function renderDashboard() {
            const grid = document.getElementById("bookGrid");
            document.getElementById("bookCount").textContent = `${booksDatabase.length} Books Available`;
            grid.innerHTML = "";

            // User requested 2 Left, 2 Right, which means a 2-column layout.
            // Tailwind class 'md:grid-cols-2' handles this beautifully.
            
            booksDatabase.forEach(book => {
                const tagsHtml = book.tags.map(tag => `<span class="bg-brand-100 text-brand-800 dark:bg-brand-900/60 dark:text-brand-300 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">${tag}</span>`).join('');
                
                const card = document.createElement("div");
                card.className = "group bg-white dark:bg-gray-900 rounded-2xl shadow-md hover:shadow-2xl transition-all duration-300 overflow-hidden border border-gray-100 dark:border-gray-800 cursor-pointer flex flex-col sm:flex-row transform hover:-translate-y-1 h-full";
                
                card.onclick = () => openBook(book);

                card.innerHTML = `
                    <!-- Left Side: Poster (Cover Image) -->
                    <div class="sm:w-2/5 md:w-1/2 lg:w-2/5 relative overflow-hidden shrink-0">
                        <img src="${book.coverImage}" alt="${book.title} Cover" class="book-cover transform group-hover:scale-105 transition-transform duration-700 ease-in-out">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent sm:hidden flex items-end p-4">
                            <h3 class="text-white font-bold text-xl">${book.title}</h3>
                        </div>
                    </div>
                    
                    <!-- Right Side: Details -->
                    <div class="p-6 flex flex-col flex-grow w-full">
                        <div class="flex gap-2 flex-wrap mb-3">
                            ${tagsHtml}
                        </div>
                        
                        <h3 class="text-gray-900 dark:text-white font-black text-2xl leading-tight mb-1 hidden sm:block group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">${book.title}</h3>
                        <p class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-4"><i class="fa-solid fa-pen-nib mr-1"></i> ${book.author}</p>
                        
                        <p class="text-gray-600 dark:text-gray-300 text-sm line-clamp-4 mb-6 flex-grow leading-relaxed">${book.description}</p>
                        
                        <!-- Read Button -->
                        <div class="mt-auto pt-4 border-t border-gray-100 dark:border-gray-800">
                            <button class="w-full bg-brand-50 hover:bg-brand-600 text-brand-700 hover:text-white dark:bg-gray-800 dark:hover:bg-brand-600 dark:text-brand-400 dark:hover:text-white py-3 rounded-xl font-bold transition-all duration-300 flex justify-center items-center gap-2 shadow-sm">
                                <i class="fa-solid fa-book-open"></i> Read Book Now
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- URL Formatter for Google Docs ---
        // Converts standard share/edit links into clean preview links for iframe
        function getCleanDocsUrl(url) {
            if (!url) return "";
            // If it's a google docs link containing /edit or /view
            if (url.includes("docs.google.com/document/d/")) {
                // Remove everything after the Document ID and append /preview
                const baseUrl = url.split('/edit')[0].split('/view')[0];
                return `${baseUrl}/preview`;
            }
            return url; // Return as is if not a standard Google Docs URL
        }

        // --- Navigation Between Views ---
        function showDashboard() {
            // Smoothly hide reader
            const readerView = document.getElementById("readerView");
            readerView.classList.remove("show-view");
            readerView.classList.add("hide-view");
            
            setTimeout(() => {
                // Show dashboard
                const dashboardView = document.getElementById("dashboardView");
                dashboardView.classList.remove("hide-view");
                dashboardView.classList.add("show-view");
                
                // Clear iframe to stop loading/playing audio in background
                const iframe = document.getElementById("docFrame");
                iframe.src = "";
                iframe.classList.remove("opacity-100");
                iframe.classList.add("opacity-0");
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300); 
        }

        function openBook(book) {
            // Set Titles
            document.getElementById("readerBookTitle").textContent = book.title;
            
            // Format and Set Google Docs URL
            const cleanUrl = getCleanDocsUrl(book.googleDocUrl);
            currentBookUrl = cleanUrl; // Save for external link button
            
            // Show Loader, Hide Iframe Content initially
            document.getElementById("iframeLoader").style.display = "flex";
            const iframe = document.getElementById("docFrame");
            iframe.classList.remove("opacity-100");
            iframe.classList.add("opacity-0");
            
            // Load the document
            iframe.src = cleanUrl;
            
            // Switch views
            const dashboardView = document.getElementById("dashboardView");
            dashboardView.classList.remove("show-view");
            dashboardView.classList.add("hide-view");
            
            setTimeout(() => {
                const readerView = document.getElementById("readerView");
                readerView.classList.remove("hide-view");
                readerView.classList.add("show-view");
                window.scrollTo(0, 0);
            }, 300);
        }

        // Called when iframe finishes loading
        function hideLoader() {
            // Sometimes iframe onload fires before actual content is visible, 
            // a tiny timeout makes the transition smoother.
            setTimeout(() => {
                document.getElementById("iframeLoader").style.display = "none";
                const iframe = document.getElementById("docFrame");
                iframe.classList.remove("opacity-0");
                iframe.classList.add("opacity-100");
            }, 500);
        }

        // Option to open document in a new tab if iframe is blocked by browser policies
        function openExternalDoc() {
            if (currentBookUrl) {
                window.open(currentBookUrl, '_blank');
            }
        }

    </script>
</body>
</html>
