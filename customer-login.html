<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | SHREE WORLD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            width: 360px;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.15);
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 10px;
            color: #222;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4285F4;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #3367D6;
        }

        .small {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <img src="icon-512.png" class="logo" alt="Logo">
        <h2>Customer Login</h2>
        <p>Continue with Google</p>
        <button id="googleLogin">
            Continue with Google
        </button>
        <div class="small">
            SHREE WORLD PREMIUM PORTAL
        </div>
    </div>

    <script type="module">
        // ================= 1. FIREBASE IMPORTS =================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            serverTimestamp,
            collection,
            query,
            where,
            getDocs,
            addDoc,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        // ================= 2. FIREBASE CONFIGURATION =================
        const firebaseConfig = {
            apiKey: "AIzaSyCOMp4Z4XncCXCLiKb3OwsqkAMe2oFSd2I",
            authDomain: "rkyshree-2f74b.firebaseapp.com",
            projectId: "rkyshree-2f74b",
            storageBucket: "rkyshree-2f74b.firebasestorage.app",
            messagingSenderId: "354823113610",
            appId: "1:354823113610:web:d043805305c945339c9673",
            measurementId: "G-WSXGTGFWYK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // ================= 3. GOOGLE LOGIN =================
        const loginBtn = document.getElementById("googleLogin");
        if(loginBtn) {
            loginBtn.addEventListener("click", async () => {
                try {
                    const result = await signInWithPopup(auth, provider);
                    const user = result.user;
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);

                    // पहली बार Login
                    if (!userSnap.exists()) {
                        await setDoc(userRef, {
                            uid: user.uid,
                            name: user.displayName || "",
                            email: user.email || "",
                            photo: user.photoURL || "",
                            mobile: "",
                            wallet: 0,
                            totalReferral: 0,
                            referralCode: "SHREE" + user.uid.substring(0, 6).toUpperCase(),
                            status: "Active",
                            joinedOn: serverTimestamp()
                        });
                    }

                    localStorage.setItem("customerUID", user.uid);
                    localStorage.setItem("customerName", user.displayName || "");
                    localStorage.setItem("customerEmail", user.email || "");
                    localStorage.setItem("customerPhoto", user.photoURL || "");

                    alert("✅ Login Successful");
                    window.location.replace("index.html");

                } catch (error) {
                    console.error(error);
                    alert(error.message);
                }
            });
        }

        // ================= 4. AUTO LOGIN / AUTH STATE =================
        onAuthStateChanged(auth, (user) => {

if(user){

localStorage.setItem("customerUID", user.uid);
localStorage.setItem("customerName", user.displayName || "");
localStorage.setItem("customerEmail", user.email || "");
localStorage.setItem("customerPhoto", user.photoURL || "");

}

});

        // ================= 5. GLOBAL FUNCTIONS =================

        window.getCustomer = function () {
            return {
                uid: localStorage.getItem("customerUID"),
                name: localStorage.getItem("customerName"),
                email: localStorage.getItem("customerEmail"),
                photo: localStorage.getItem("customerPhoto")
            };
        };

        window.customerLogout = async function () {
            try {
                await signOut(auth);
                localStorage.clear();
                alert("Logout Successful");
                window.location.href = "customer-login.html";
            } catch (error) {
                console.log(error);
                alert(error.message);
            }
        };

        window.checkCustomerLogin = function () {
            const uid = localStorage.getItem("customerUID");
            if (!uid) {
                window.location.href = "customer-login.html";
                return false;
            }
            return true;
        };

        window.showCustomerName = function (id) {
            const name = localStorage.getItem("customerName");
            if (document.getElementById(id)) {
                document.getElementById(id).innerText = name || "Customer";
            }
        };

        window.showCustomerPhoto = function (id) {
            const photo = localStorage.getItem("customerPhoto");
            if (document.getElementById(id) && photo) {
                document.getElementById(id).src = photo;
            }
        };

        window.loadCustomerProfile = async function () {
            const uid = localStorage.getItem("customerUID");
            if (!uid) return;
            try {
                const ref = doc(db, "users", uid);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    const data = snap.data();
                    if (document.getElementById("customerName")) document.getElementById("customerName").innerText = data.name || "";
                    if (document.getElementById("customerEmail")) document.getElementById("customerEmail").innerText = data.email || "";
                    if (document.getElementById("customerWallet")) document.getElementById("customerWallet").innerText = "₹" + (data.wallet || 0);
                    if (document.getElementById("customerReferral")) document.getElementById("customerReferral").innerText = data.referralCode || "";
                    if (document.getElementById("customerPhoto")) document.getElementById("customerPhoto").src = data.photo || "icon-192.png";
                }
            } catch (err) {
                console.log(err);
            }
        };

        window.copyReferral = function () {
            const el = document.getElementById("customerReferral");
            if(el){
                navigator.clipboard.writeText(el.innerText);
                alert("Referral Code Copied");
            }
        };

        window.getReferralLink = function () {
            const code = document.getElementById("customerReferral")?.innerText || "";
            return "https://www.rkyshree.in/?ref=" + code;
        };

        window.shareReferralLink = function () {
            const link = window.getReferralLink();
            navigator.clipboard.writeText(link);
            alert("Referral Link Copied");
        };

        window.openOrderHistory = function () {
            window.location.href = "order-history.html";
        };

        window.openTrackOrder = function () {
            window.location.href = "track-order.html";
        };

        window.createCustomerCard = function () {
            const name = localStorage.getItem("customerName") || "Customer";
            const photo = localStorage.getItem("customerPhoto") || "icon-192.png";
            return `
            <div style="background:#fff; padding:20px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,.1); margin:20px 0; text-align:center;">
                <img id="customerPhoto" src="${photo}" style="width:90px; height:90px; border-radius:50%; border:4px solid #0d6efd; object-fit:cover;">
                <h2 id="customerName" style="margin-top:10px;">${name}</h2>
                <p id="customerEmail"></p>
                <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:15px; margin-top:20px;">
                    <div style="background:#f8f9fa; padding:15px; border-radius:10px;">
                        <h4>Wallet</h4>
                        <h2 id="customerWallet">₹0</h2>
                    </div>
                    <div style="background:#f8f9fa; padding:15px; border-radius:10px;">
                        <h4>Referral</h4>
                        <h3 id="customerReferral">Loading...</h3>
                    </div>
                </div>
                <div style="margin-top:20px;">
                    <button onclick="copyReferral()">Copy Referral</button>
                    <button onclick="openOrderHistory()" style="margin-top:10px;">My Orders</button>
                    <button onclick="openTrackOrder()" style="margin-top:10px;">Track Order</button>
                    <button onclick="customerLogout()" style="margin-top:10px; background:red;">Logout</button>
                </div>
            </div>`;
        };

        window.showProfile = function (id) {
            const el = document.getElementById(id);
            if(el) {
                el.innerHTML = window.createCustomerCard();
                window.loadCustomerProfile();
            }
        };

        window.loadMyOrders = async function (tableId) {
            const uid = localStorage.getItem("customerUID");
            if (!uid) return;
            const tbody = document.getElementById(tableId);
            if (!tbody) return;

            tbody.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";
            try {
                const q = query(collection(db, "orders"), where("uid", "==", uid));
                const snapshot = await getDocs(q);
                let html = "";
                if (snapshot.empty) {
                    html = "<tr><td colspan='5'>No Orders Found</td></tr>";
                } else {
                    snapshot.forEach((doc) => {
                        const d = doc.data();
                        html += `
                        <tr>
                            <td>${d.orderId || "-"}</td>
                            <td>${d.service || "-"}</td>
                            <td>₹${d.amount || 0}</td>
                            <td>${d.status || "Pending"}</td>
                            <td>${d.date || "-"}</td>
                        </tr>`;
                    });
                }
                tbody.innerHTML = html;
            } catch (e) {
                console.log(e);
                tbody.innerHTML = "<tr><td colspan='5'>Error Loading Orders</td></tr>";
            }
        };

        window.updateLoginButton = function (id) {
            const btn = document.getElementById(id);
            if (!btn) return;
            const name = localStorage.getItem("customerName");
            const photo = localStorage.getItem("customerPhoto");
            if (name) {
                btn.innerHTML = `<img src="${photo}" style="width:32px; height:32px; border-radius:50%; vertical-align:middle; margin-right:8px;"> ${name}`;
                btn.href = "profile.html";
            }
        };

        window.loadWallet = async function () {
            const uid = localStorage.getItem("customerUID");
            if (!uid) return;
            try {
                const ref = doc(db, "users", uid);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    const data = snap.data();
                    if (document.getElementById("walletBalance")) {
                        document.getElementById("walletBalance").innerText = "₹" + (data.wallet || 0);
                    }
                }
            } catch (err) {
                console.log(err);
            }
        };

        window.sendWithdrawRequest = async function () {
            const uid = localStorage.getItem("customerUID");
            const amount = document.getElementById("withdrawAmount")?.value;
            const upi = document.getElementById("withdrawUpi")?.value;

            if (!amount || !upi) {
                alert("Please Fill All Details");
                return;
            }

            try {
                await addDoc(collection(db, "withdrawRequests"), {
                    uid: uid,
                    amount: Number(amount),
                    upi: upi,
                    status: "Pending",
                    date: new Date().toLocaleString()
                });
                alert("Withdraw Request Submitted");
            } catch (err) {
                alert(err.message);
            }
        };

        window.listenNewOrders = function () {
            const ordersRef = collection(db, "orders");
            onSnapshot(ordersRef, (snapshot) => {
                const total = snapshot.size;
                const badge = document.getElementById("notificationCount");
                if (badge) badge.innerText = total;

                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        if ("Notification" in window) {
                            Notification.requestPermission().then((permission) => {
                                if (permission === "granted") {
                                    new Notification("🛒 New Order Received", {
                                        body: (data.name || "Customer") + " ordered " + (data.service || "Service")
                                    });
                                }
                            });
                        }
                    }
                });
            });
        };

        window.loadDashboardLive = function () {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const e = document.getElementById("totalUsers");
                if (e) e.innerText = snapshot.size;
            });

            onSnapshot(collection(db, "orders"), (snapshot) => {
                const e = document.getElementById("totalOrders");
                if (e) e.innerText = snapshot.size;
                let revenue = 0;
                snapshot.forEach((doc) => {
                    const d = doc.data();
                    revenue += Number(d.amount || 0);
                });
                const r = document.getElementById("totalRevenue");
                if (r) r.innerText = "₹" + revenue.toLocaleString("en-IN");
            });

            onSnapshot(collection(db, "reviews"), (snapshot) => {
                const e = document.getElementById("totalReviews");
                if (e) e.innerText = snapshot.size;
            });
        };

        // ================= 6. INITIALIZE ON LOAD =================
        window.addEventListener("load", () => {
            window.loadCustomerProfile();
            window.loadWallet();
            window.listenNewOrders();
            
            // Check if dashboard elements exist before running live dashboard script
            if (document.getElementById("totalUsers")) {
                window.loadDashboardLive();
            }
        });

    </script>
</body>
</html>
