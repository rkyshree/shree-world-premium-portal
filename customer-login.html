<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Portal | SHREE WORLD</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4285F4;
            --primary-hover: #3367D6;
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --text-dark: #333;
            --text-light: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-light);
            padding: 20px;
        }

        /* Glassmorphism Card */
        .portal-box {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
            background: #fff;
            border-radius: 50%;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 30px;
            padding: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #ccc;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 25px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 10px rgba(66, 133, 244, 0.4);
        }

        /* Sections */
        .section {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        p.subtitle {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 30px;
        }

        /* Buttons & Inputs */
        .google-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #fff;
            color: var(--text-dark);
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .google-btn:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
        }

        .google-btn img {
            width: 24px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px 15px 45px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #bbb;
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: rgba(255,255,255,0.15);
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #bbb;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
        }

        .action-btn:hover {
            background: var(--primary-hover);
        }

        /* Order Result Box */
        #trackResult {
            margin-top: 20px;
            text-align: left;
        }

        .order-card {
            background: rgba(255,255,255,0.9);
            color: var(--text-dark);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .order-card p {
            margin-bottom: 5px;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }

        .status-pending { background: #f39c12; }
        .status-processing { background: #3498db; }
        .status-completed { background: #2ecc71; }
        .status-cancelled { background: #e74c3c; }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="portal-box">
        <img src="icon-512.png" class="logo" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3063/3063822.png'">
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Customer Login</button>
            <button class="tab-btn" onclick="switchTab('track')">Track Order</button>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="section active">
            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to access your premium dashboard</p>
            
            <button id="googleLogin" class="google-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G">
                Continue with Google
            </button>
        </div>

        <!-- Track Order Section -->
        <div id="trackSection" class="section">
            <h2>Track Your Order</h2>
            <p class="subtitle">Enter Mobile No. or Order ID</p>

            <div class="input-group">
                <i class="fas fa-search"></i>
                <input type="text" id="trackInput" placeholder="e.g. 9876543210 or ORD-123">
            </div>
            
            <button id="trackBtn" class="action-btn">
                <i class="fas fa-truck"></i> Track Now
            </button>

            <div id="trackResult"></div>
        </div>

        <div class="footer-text">
            SHREE WORLD PREMIUM PORTAL &copy; 2026
        </div>
    </div>

    <script type="module">
        // ================= 1. FIREBASE IMPORTS =================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        // ================= 2. FIREBASE CONFIGURATION =================
        const firebaseConfig = {
            apiKey: "AIzaSyCOMp4Z4XncCXCLiKb3OwsqkAMe2oFSd2I",
            authDomain: "rkyshree-2f74b.firebaseapp.com",
            projectId: "rkyshree-2f74b",
            storageBucket: "rkyshree-2f74b.firebasestorage.app",
            messagingSenderId: "354823113610",
            appId: "1:354823113610:web:d043805305c945339c9673",
            measurementId: "G-WSXGTGFWYK"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // ================= 3. TAB SWITCHING LOGIC =================
        window.switchTab = function(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            const sections = document.querySelectorAll('.section');
            
            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));

            if(tab === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginSection').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('trackSection').classList.add('active');
            }
        };

        // ================= 4. GOOGLE LOGIN =================
        const loginBtn = document.getElementById("googleLogin");
        if(loginBtn) {
            loginBtn.addEventListener("click", async () => {
                try {
                    // Changing text to show process
                    loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Please wait...';
                    
                    const result = await signInWithPopup(auth, provider);
                    const user = result.user;
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);

                    // First time login setup
                    if (!userSnap.exists()) {
                        await setDoc(userRef, {
                            uid: user.uid,
                            name: user.displayName || "",
                            email: user.email || "",
                            photo: user.photoURL || "",
                            mobile: "",
                            wallet: 0,
                            totalReferral: 0,
                            referralCode: "SHREE" + user.uid.substring(0, 6).toUpperCase(),
                            status: "Active",
                            joinedOn: serverTimestamp()
                        });
                    }

                    localStorage.setItem("customerUID", user.uid);
                    localStorage.setItem("customerName", user.displayName || "");
                    localStorage.setItem("customerEmail", user.email || "");
                    localStorage.setItem("customerPhoto", user.photoURL || "");

                    window.location.replace("index.html"); // Redirect after login

                } catch (error) {
                    console.error(error);
                    alert("Login Failed: " + error.message);
                    loginBtn.innerHTML = '<img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G"> Continue with Google';
                }
            });
        }

        // ================= 5. TRACK ORDER LOGIC =================
        const trackBtn = document.getElementById("trackBtn");
        if(trackBtn) {
            trackBtn.addEventListener("click", async () => {
                const inputVal = document.getElementById("trackInput").value.trim();
                const resultDiv = document.getElementById("trackResult");
                
                if(!inputVal) {
                    resultDiv.innerHTML = "<p style='color: #ff6b6b; font-size:14px;'><i class='fas fa-exclamation-circle'></i> Please enter Order ID or Mobile No.</p>";
                    return;
                }

                resultDiv.innerHTML = "<p style='color: #4cd137; font-size:14px;'><i class='fas fa-spinner fa-spin'></i> Searching your order...</p>";

                try {
                    // 1. Search by Order ID first
                    let ordersRef = collection(db, "orders");
                    let q = query(ordersRef, where("orderId", "==", inputVal));
                    let querySnapshot = await getDocs(q);

                    // 2. If not found, Search by Mobile Number
                    if (querySnapshot.empty) {
                        q = query(ordersRef, where("mobile", "==", inputVal));
                        querySnapshot = await getDocs(q);
                    }

                    if (querySnapshot.empty) {
                        resultDiv.innerHTML = "<p style='color: #ff6b6b; font-size:14px;'><i class='fas fa-times-circle'></i> No order found with this detail.</p>";
                        return;
                    }

                    let html = "";
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        const statusClass = (data.status || 'pending').toLowerCase();
                        
                        html += `
                        <div class="order-card">
                            <p><strong><i class="fas fa-box"></i> Order ID:</strong> ${data.orderId || doc.id}</p>
                            <p><strong><i class="fas fa-tools"></i> Service:</strong> ${data.service || "N/A"}</p>
                            <p><strong><i class="fas fa-rupee-sign"></i> Amount:</strong> ₹${data.amount || 0}</p>
                            <p style="margin-top: 10px;">
                                <strong>Status:</strong> 
                                <span class="status-badge status-${statusClass}">${data.status || "Pending"}</span>
                            </p>
                        </div>`;
                    });

                    resultDiv.innerHTML = html;

                } catch (error) {
                    console.error(error);
                    resultDiv.innerHTML = "<p style='color: #ff6b6b; font-size:14px;'><i class='fas fa-exclamation-triangle'></i> Error fetching order details.</p>";
                }
            });
        }
    </script>
</body>
</html>
