<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SHRAYNEX Admin Login</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:#050505;
  color:#fff;
}
.login-box{
  width:92%;
  max-width:400px;
  padding:30px;
  border:1px solid #292929;
  border-radius:22px;
  background:#111;
  box-shadow:0 20px 60px #000;
}
.logo{
  text-align:center;
  font-size:30px;
  font-weight:800;
  margin-bottom:5px;
}
.logo span{color:#00e676}
.sub{
  text-align:center;
  color:#999;
  margin-bottom:25px;
}
label{
  display:block;
  margin:15px 0 7px;
  color:#bbb;
  font-size:14px;
}
input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #333;
  background:#080808;
  color:white;
  outline:none;
}
input:focus{border-color:#00e676}
button{
  width:100%;
  padding:14px;
  margin-top:22px;
  border:0;
  border-radius:12px;
  background:#00e676;
  color:#000;
  font-weight:800;
  cursor:pointer;
}
button:disabled{
  opacity:.5;
}
.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  font-size:13px;
  line-height:1.5;
}
.error{
  display:block;
  background:#351010;
  color:#ff8b8b;
}
.success{
  display:block;
  background:#0c2d1c;
  color:#72ffae;
}
.uid{
  word-break:break-all;
  color:#fff;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">SHRAY<span>NEX</span></div>
  <div class="sub">Admin Control Panel</div>

  <label>Admin Email</label>
  <input id="email" type="email" placeholder="admin@example.com">

  <label>Password</label>
  <input id="password" type="password" placeholder="••••••••">

  <button id="loginBtn">LOGIN TO ADMIN</button>

  <div id="message" class="message"></div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey:"AIzaSyCOMp4Z4XncCXCLiKb3OwsqkAMe2oFSd2I",
  authDomain:"rkyshree-2f74b.firebaseapp.com",
  projectId:"rkyshree-2f74b",
  storageBucket:"rkyshree-2f74b.firebasestorage.app"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");


function showMessage(text,type="error"){
  message.className="message "+type;
  message.innerHTML=text;
}


loginBtn.addEventListener("click",async()=>{

  const email=emailInput.value.trim();
  const password=passwordInput.value;

  if(!email || !password){
    showMessage("Email aur password dono enter karein.");
    return;
  }

  loginBtn.disabled=true;
  loginBtn.textContent="CHECKING...";

  try{

    await signInWithEmailAndPassword(auth,email,password);

  }catch(error){

    console.error(error);

    let msg="Login failed.";

    if(error.code==="auth/invalid-credential"){
      msg="Email ya password galat hai.";
    }
    else if(error.code==="auth/user-not-found"){
      msg="Ye admin account Firebase Authentication mein nahi mila.";
    }
    else if(error.code==="auth/wrong-password"){
      msg="Password galat hai.";
    }
    else if(error.code==="auth/too-many-requests"){
      msg="Bahut baar login try hua hai. Thodi der baad try karein.";
    }

    showMessage(msg);

    loginBtn.disabled=false;
    loginBtn.textContent="LOGIN TO ADMIN";
  }

});


onAuthStateChanged(auth,async(user)=>{

  if(!user) return;

  try{

    const adminRef=doc(db,"shraynex_users",user.uid);
    const adminSnap=await getDoc(adminRef);

    if(!adminSnap.exists()){

      await signOut(auth);

      showMessage(
        "Admin profile nahi mila.<br><br>"+
        "<b>Firebase UID:</b>"+
        "<div class='uid'>"+user.uid+"</div>"+
        "<br>Firestore → shraynex_users mein isi UID ke naam se document banayein."
      );

      loginBtn.disabled=false;
      loginBtn.textContent="LOGIN TO ADMIN";
      return;
    }

    const data=adminSnap.data();

    if(data.role!=="admin"){

      await signOut(auth);

      showMessage(
        "Access Denied.<br><br>"+
        "Is account ka role <b>admin</b> nahi hai."
      );

      loginBtn.disabled=false;
      loginBtn.textContent="LOGIN TO ADMIN";
      return;
    }

    if(data.status && data.status!=="approved"){

      await signOut(auth);

      showMessage("Admin account approved nahi hai.");
      loginBtn.disabled=false;
      loginBtn.textContent="LOGIN TO ADMIN";
      return;
    }

    showMessage("Admin verified. Dashboard opening...","success");

    setTimeout(()=>{
      window.location.href="./dashboard.html";
    },500);

  }catch(error){

    console.error(error);

    showMessage(
      "Admin verification failed.<br><br>"+
      error.message
    );

    loginBtn.disabled=false;
    loginBtn.textContent="LOGIN TO ADMIN";
  }

});

</script>

</body>
</html>
