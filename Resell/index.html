<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Reseller Portal</title>
    <style>
        :root {
            --primary: #1a73e8;
            --bg: #f4f7f6;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; background-color: var(--bg); color: var(--text);
        }
        header {
            background-color: var(--primary); color: white; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .wallet {
            background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px;
            font-weight: bold; display: flex; align-items: center; gap: 10px;
        }
        .btn-withdraw {
            background: #28a745; color: white; border: none; padding: 5px 10px;
            border-radius: 5px; cursor: pointer; font-size: 12px;
        }
        
        /* Left to Right Slider */
        .slider-container {
            padding: 20px;
        }
        .slider-title { margin-bottom: 15px; font-size: 20px; }
        .product-slider {
            display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px;
            scroll-behavior: smooth;
        }
        .product-slider::-webkit-scrollbar { height: 8px; }
        .product-slider::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        
        .product-card {
            min-width: 200px; background: white; border-radius: 10px; padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; text-align: center;
            transition: transform 0.2s;
        }
        .product-card:hover { transform: scale(1.02); }
        .product-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; background: #e0e0e0; }
        .product-price { color: #e91e63; font-weight: bold; margin: 10px 0; }

        /* Modal / Popup Styles */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 200;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px;
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .close-btn {
            position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #888;
        }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group select, .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
        }
        
        .action-btn {
            width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer;
            font-size: 16px; font-weight: bold; margin-bottom: 10px; color: white;
        }
        .btn-order { background-color: var(--primary); }
        .btn-share { background-color: #ff9800; }
        
        .profit-badge {
            background: #e8f5e9; color: #2e7d32; padding: 5px 10px; border-radius: 15px;
            font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div>श्री Reseller Portal</div>
        <div class="wallet">
            कमाई: ₹<span id="wallet-balance">0</span>
            <button class="btn-withdraw" onclick="withdraw()">Withdraw</button>
        </div>
    </header>

    <div class="slider-container">
        <h2 class="slider-title">ट्रेंडिंग प्रोडक्ट्स</h2>
        <!-- Left to Right Slider -->
        <div class="product-slider">
            <div class="product-card" onclick="openProductDetail('Running Shoes (Galaxy Style)', 2500, 300)">
                <div class="product-img" style="background: url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=300') center/cover;"></div>
                <h3>Running Shoes</h3>
                <div class="product-price">₹2,500</div>
                <div style="font-size: 12px; color: gray;">शेयर प्रॉफिट: ₹300</div>
            </div>
            <div class="product-card" onclick="openProductDetail('Classic White T-Shirt', 500, 100)">
                <div class="product-img" style="background: url('https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=300') center/cover;"></div>
                <h3>Classic T-Shirt</h3>
                <div class="product-price">₹500</div>
                <div style="font-size: 12px; color: gray;">शेयर प्रॉफिट: ₹100</div>
            </div>
            <div class="product-card" onclick="openProductDetail('Smart Fitness Watch', 1500, 250)">
                <div class="product-img" style="background: url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=300') center/cover;"></div>
                <h3>Smart Watch</h3>
                <div class="product-price">₹1,500</div>
                <div style="font-size: 12px; color: gray;">शेयर प्रॉफिट: ₹250</div>
            </div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('productModal')">&times;</span>
            <h2 id="modalTitle">Product Name</h2>
            <div class="product-price" id="modalPrice" style="font-size: 24px;">₹0</div>
            <div class="profit-badge" id="modalProfit">प्रॉफिट: ₹0/सेल</div>
            
            <div class="form-group">
                <label>साइज चुनें:</label>
                <select id="sizeSelect">
                    <option>Small (S)</option>
                    <option>Medium (M)</option>
                    <option>Large (L)</option>
                    <option>Extra Large (XL)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>क्वांटिटी:</label>
                <input type="number" id="qtyInput" value="1" min="1">
            </div>

            <button class="action-btn btn-share" onclick="generateShareLink()">📤 शेयर करें (Share & Earn)</button>
            <button class="action-btn btn-order" onclick="openCheckout()">🛒 अभी खरीदें</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('checkoutModal')">&times;</span>
            <h2>ऑर्डर डिटेल भरें</h2>
            <p id="checkoutSummary" style="color: gray; font-size: 14px;"></p>
            
            <div class="form-group">
                <label>पूरा नाम:</label>
                <input type="text" id="custName" placeholder="अपना नाम लिखें">
            </div>
            <div class="form-group">
                <label>मोबाइल नंबर:</label>
                <input type="tel" id="custMobile" placeholder="10 अंकों का मोबाइल नंबर">
            </div>
            <div class="form-group">
                <label>पिन कोड:</label>
                <input type="number" id="custPin" placeholder="Area PIN Code">
            </div>
            <div class="form-group">
                <label>पूरा पता (Address):</label>
                <textarea id="custAddress" rows="3" placeholder="मकान नंबर, गली, गांव/शहर"></textarea>
            </div>

            <button class="action-btn btn-order" onclick="placeOrder()">✅ ऑर्डर कन्फर्म करें</button>
        </div>
    </div>

    <script>
        let currentProduct = "";
        let currentPrice = 0;
        let currentProfit = 0;
        let walletBalance = 0;

        function openProductDetail(name, price, profit) {
            currentProduct = name;
            currentPrice = price;
            currentProfit = profit;
            
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrice').innerText = "₹" + price;
            document.getElementById('modalProfit').innerText = "आपका प्रॉफिट: ₹" + profit + " / सेल";
            
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function generateShareLink() {
            // Simulated Share Link Logic
            let refId = "USER" + Math.floor(Math.random() * 10000);
            let link = `https://shreestore.in/product?id=101&ref=${refId}`;
            
            // Copies to clipboard
            navigator.clipboard.writeText(link).then(() => {
                alert(`लिंक कॉपी हो गया है!\n\nलिंक: ${link}\n\nजब भी कोई इस लिंक से खरीदेगा, तो ₹${currentProfit} आपके वॉलेट में जुड़ जाएंगे। कीमत ग्राहक के लिए समान (₹${currentPrice}) ही रहेगी।`);
            });
        }

        function openCheckout() {
            closeModal('productModal');
            let size = document.getElementById('sizeSelect').value;
            let qty = document.getElementById('qtyInput').value;
            
            document.getElementById('checkoutSummary').innerText = `${currentProduct} | साइज: ${size} | क्वांटिटी: ${qty} | कुल कीमत: ₹${currentPrice * qty}`;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function placeOrder() {
            let name = document.getElementById('custName').value;
            let mobile = document.getElementById('custMobile').value;
            let pin = document.getElementById('custPin').value;
            let address = document.getElementById('custAddress').value;

            if(!name || !mobile || !pin || !address) {
                alert("कृपया ऑर्डर करने के लिए सभी जानकारी भरें!");
                return;
            }

            // Simulate Order Success and Affiliate Profit Credit
            alert(`🎉 आपका ऑर्डर सफलतापूर्वक प्लेस हो गया है!\n\nनाम: ${name}\nएड्रेस: ${address}\n\n(डेमो: चूंकि आप खुद के पोर्टल से ऑर्डर कर रहे हैं, प्रॉफिट ₹${currentProfit} वॉलेट में जोड़ दिया गया है।)`);
            
            // Add profit to wallet
            walletBalance += currentProfit;
            document.getElementById('wallet-balance').innerText = walletBalance;
            
            // Reset and close
            document.getElementById('custName').value = "";
            document.getElementById('custMobile').value = "";
            document.getElementById('custPin').value = "";
            document.getElementById('custAddress').value = "";
            closeModal('checkoutModal');
        }

        function withdraw() {
            if(walletBalance <= 0) {
                alert("विड्रॉल करने के लिए आपके वॉलेट में बैलेंस नहीं है। शेयर करके पैसे कमाएं!");
            } else {
                let upi = prompt("विड्रॉल के लिए अपनी UPI ID या बैंक अकाउंट नंबर डालें:");
                if(upi) {
                    alert(`₹${walletBalance} आपके अकाउंट (${upi}) में ट्रांसफर की रिक्वेस्ट सबमिट हो गई है। 24 घंटे में पैसा आ जाएगा।`);
                    walletBalance = 0;
                    document.getElementById('wallet-balance').innerText = walletBalance;
                }
            }
        }
    </script>
</body>
</html>
