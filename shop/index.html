      <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-xs text-slate-400 font-medium">Deals Load Ho Rahi Hain...</p>
    </div>

    <!-- User ka Provided Iframe -->
    <iframe 
      id="deals-frame" 
      src="https://inrdeals.com/embed/deals?user=arm532515116" 
      class="w-full h-full border-0 relative z-10" 
      allowTransparency="true"
      onload="hideSpinner()">
    </iframe>
  </main>

  <!-- ========================================== -->
  <!-- 4. Interactive JavaScript Controls         -->
  <!-- ========================================== -->
  <script>
    // Loading indicator ko hide karne ka function
    function hideSpinner() {
      const spinner = document.getElementById('loading-spinner');
      if (spinner) {
        spinner.style.opacity = '0';
        setTimeout(() => {
          spinner.style.display = 'none';
        }, 300);
      }
    }

    // Deals Frame Refresh karne ka function
    function refreshDeals() {
      const iframe = document.getElementById('deals-frame');
      const icon = document.getElementById('refresh-icon');
      const spinner = document.getElementById('loading-spinner');

      if (spinner) {
        spinner.style.display = 'flex';
        spinner.style.opacity = '1';
      }

      icon.classList.add('fa-spin');
      iframe.src = iframe.src;

      setTimeout(() => {
        icon.classList.remove('fa-spin');
      }, 1000);
    }

    // Fullscreen Toggle function
    function toggleFullScreen() {
      const icon = document.getElementById('fullscreen-icon');
      
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          icon.classList.remove('fa-expand');
          icon.classList.add('fa-compress');
        }).catch(err => {
          console.error("Full screen mode open nahi ho saka: ", err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            icon.classList.remove('fa-compress');
            icon.classList.add('fa-expand');
          });
        }
      }
    }

    // Window Resize handlers for clean iframe adjustment
    window.addEventListener('resize', () => {
      // Auto adjust height context
    });
  </script>
