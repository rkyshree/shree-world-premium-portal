<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EDVYNOX - Shopping</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    /* HEADER */
    .header {
      background: #ffffff;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .support {
      text-decoration: none;
      background: #25D366;
      color: white;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
    }

    /* BANNER */
    .banner {
      margin: 18px auto;
      max-width: 1200px;
      width: calc(100% - 30px);
      min-height: 180px;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
    }

    .banner h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .banner p {
      color: #d1d5db;
      font-size: 15px;
    }

    /* PRODUCTS */
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 10px 15px 40px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin: 15px 0;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      transition: 0.2s ease;
    }

    .product:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 220px;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 12px;
    }

    .placeholder {
      font-size: 50px;
    }

    .product-info {
      padding: 15px;
    }

    .product-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      min-height: 42px;
    }

    .buy-btn {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #2874f0;
      color: white;
      padding: 11px;
      border-radius: 8px;
      margin-top: 13px;
      font-weight: bold;
      font-size: 14px;
    }

    .buy-btn:hover {
      background: #1557c0;
    }

    /* FOOTER */
    footer {
      text-align: center;
      background: #111827;
      color: #9ca3af;
      padding: 25px 15px;
      margin-top: 20px;
      font-size: 13px;
    }

    footer strong {
      color: white;
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 650px) {
      .header {
        padding: 14px;
      }

      .logo {
        font-size: 21px;
      }

      .support {
        padding: 8px 12px;
        font-size: 12px;
      }

      .banner {
        min-height: 150px;
      }

      .banner h1 {
        font-size: 25px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-image {
        height: 170px;
      }

      .product-info {
        padding: 11px;
      }

      .product-title {
        font-size: 13px;
      }
    }

    @media (max-width: 380px) {
      .products {
        grid-template-columns: 1fr 1fr;
      }

      .product-image {
        height: 145px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       EDVYNOX HEADER
  ========================== -->

  <header class="header">

    <div class="logo">
      EDVYNOX
    </div>

    <a
      class="support"
      href="https://wa.me/919451239239"
      target="_blank">
      WhatsApp Support
    </a>

  </header>


  <!-- =========================
       BANNER
  ========================== -->

  <section class="banner">

    <div>
      <h1>EDVYNOX</h1>

    </div>

  ========================== -->

    /*
    =====================================================
       नीचे का CODE बदलने की जरूरत नहीं है
    =====================================================
    */


    const productContainer =
      document.getElementById("products");


    function createProduct(product, index) {

      const card =
        document.createElement("div");

      card.className = "product";


      let imageHTML = "";

      if (product.image && product.image.trim() !== "") {

        imageHTML = `
          <img
            src="${product.image}"
            alt="${product.title}"
            loading="lazy"
            onerror="this.parentElement.innerHTML='<div class=&quot;placeholder&quot;>🛍️</div>'"
          >
        `;

      } else {

        imageHTML = `
          <div class="placeholder">
            🛍️
          </div>
        `;

      }


      card.innerHTML = `

        <a
          href="${product.link}"
          target="_blank"
          rel="noopener noreferrer"
          style="text-decoration:none;color:inherit;"
        >

          <div class="product-image">
            ${imageHTML}
          </div>

        </a>


        <div class="product-info">

          <div class="product-title">
            ${product.title}
          </div>


          <a
            class="buy-btn"
            href="${product.link}"
            target="_blank"
            rel="noopener noreferrer"
          >
            🛒 Buy Now 
          </a>

        </div>

      `;


      return card;

    }


    function loadProducts() {

      productContainer.innerHTML = "";


      PRODUCT_LINKS.forEach(
        (product, index) => {

          if (
            product.link &&
            product.link.trim() !== ""
          ) {

            productContainer.appendChild(
              createProduct(product, index)
            );

          }

        }
      );

    }


    loadProducts();

  </script>

</body>
</html>
