<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Best Deals & Offers</title>

  <meta name="description"
        content="Latest deals, discounts and cashback offers">

  <meta name="theme-color" content="#111827">

  <style>

    /* =========================
       BASIC RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background: #f3f4f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      background: #111827;
      color: white;
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
      position: sticky;
      top: 0;
      z-index: 9999;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
    }

    .header p {
      margin-top: 5px;
      font-size: 13px;
      opacity: 0.85;
    }


    /* =========================
       MAIN CONTAINER
       DESKTOP STYLE
    ========================= */

    .container {
      width: 100%;
      max-width: 1400px;
      margin: auto;
      padding: 12px;
    }


    /* =========================
       DEALS AREA
    ========================= */

    .deals-container {
      width: 100%;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 15px rgba(0,0,0,0.08);
    }


    /* =========================
       LOADING
    ========================= */

    .loading {
      width: 100%;
      padding: 15px;
      text-align: center;
      background: #ffffff;
      color: #666;
      font-size: 14px;
    }


    /* =========================
       INRDEALS IFRAME

       बहुत बड़ी HEIGHT
       ताकि page लगातार scroll हो
    ========================= */

    .inrdeals-frame {

      display: block;

      width: 100%;

      /*
        लगभग 500 products के लिए
        बड़ा scrolling area
      */

      height: 50000px;

      border: 0;

      background: #ffffff;

      overflow: hidden;
    }


    /* =========================
       POWERED BY
       500 PRODUCTS के बाद
    ========================= */

    .powered {

      width: 100%;

      padding: 30px 15px;

      text-align: center;

      background: #ffffff;

      border-top: 1px solid #eeeeee;

      color: #777;

      font-size: 13px;
    }

    .powered strong {
      color: #111827;
    }


    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 1000px) {

      .container {
        padding: 20px;
      }

      .deals-container {
        border-radius: 12px;
      }

      .inrdeals-frame {
        height: 50000px;
      }

    }


    /* =========================
       TABLET
    ========================= */

    @media (min-width: 601px) and (max-width: 999px) {

      .container {
        padding: 10px;
      }

      .inrdeals-frame {
        height: 50000px;
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .header {
        padding: 13px 10px;
      }

      .header h1 {
        font-size: 19px;
      }

      .header p {
        font-size: 12px;
      }

      .container {
        padding: 5px;
      }

      .deals-container {
        border-radius: 7px;
      }

      .inrdeals-frame {

        /*
          Mobile पर भी
          बहुत लंबा scrolling area
        */

        height: 50000px;

      }

      .powered {
        padding: 25px 10px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <h1>🔥 Best Deals & Offers</h1>

    <p>
      Latest Deals • Discounts • Cashback Offers
    </p>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main class="container">

    <section class="deals-container">


      <!-- Loading -->

      <div class="loading" id="loading">

        Deals Loading...

      </div>



      <!-- =========================
           INRDEALS
      ========================== -->

      <iframe

        class="inrdeals-frame"

        src="https://inrdeals.com/embed/deals?user=arm532515116"

        title="INRDeals Latest Deals"

        frameborder="0"

        allowtransparency="true"

        loading="eager"

        referrerpolicy="strict-origin-when-cross-origin">

      </iframe>



      <!-- =========================
           POWERED BY
           सबसे नीचे
      ========================== -->

      <div class="powered">

        Powered by <strong>INRDeals</strong>

      </div>


    </section>

  </main>



  <!-- =========================
       SCRIPT
  ========================== -->

  <script>

    const iframe =
      document.querySelector(".inrdeals-frame");

    const loading =
      document.getElementById("loading");


    iframe.addEventListener("load", function () {

      loading.style.display = "none";

    });

  </script>


</body>
</html>
