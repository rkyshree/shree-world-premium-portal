<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#0f172a"
>

<title>EDVYNOX - Smart Shopping</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:#f4f7fb;

    color:#111827;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:66px;

    background:rgba(255,255,255,.97);

    border-bottom:1px solid #e5e7eb;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 16px;

    position:sticky;

    top:0;

    z-index:1000;

    backdrop-filter:blur(12px);
}


.brand{

    display:flex;

    align-items:center;

    gap:9px;
}


.logo{

    font-size:22px;

    font-weight:900;

    letter-spacing:.8px;

    background:
    linear-gradient(
        135deg,
        #111827,
        #2563eb
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}


.aff-badge{

    background:#16a34a;

    color:#fff;

    padding:5px 9px;

    border-radius:30px;

    font-size:8px;

    font-weight:900;

    letter-spacing:.5px;
}


/* INDIA */

.india-logo{

    width:42px;

    height:42px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#fff;

    border:1px solid #e5e7eb;

    box-shadow:
    0 5px 16px rgba(15,23,42,.10);

    font-size:23px;
}


/* =====================================================
   BANNER
===================================================== */

.banner-wrapper{

    width:100%;

    max-width:1250px;

    margin:14px auto 0;

    padding:0 12px;
}


.banner-slider{

    position:relative;

    width:100%;

    overflow:hidden;

    border-radius:22px;

    background:#0f172a;

    box-shadow:
    0 14px 35px rgba(15,23,42,.12);
}


.banner-track{

    display:flex;

    width:100%;

    transition:
    transform .45s
    cubic-bezier(.4,0,.2,1);
}


.banner-slide{

    min-width:100%;

    position:relative;

    overflow:hidden;

    aspect-ratio:16/6;

    background:#0f172a;
}


.banner-slide a{

    display:block;

    width:100%;

    height:100%;
}


.banner-slide img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}


/* DEFAULT BANNER */

.banner-fallback{

    width:100%;

    height:100%;

    min-height:190px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:25px;

    color:white;

    background:

    radial-gradient(
        circle at top right,
        #2563eb,
        transparent 38%
    ),

    linear-gradient(
        135deg,
        #0f172a,
        #064e3b
    );
}


.banner-fallback h1{

    font-size:32px;

    line-height:1.3;

    margin-bottom:10px;
}


.banner-fallback p{

    color:#dbeafe;

    font-size:14px;

    line-height:1.6;
}


.banner-badge{

    display:inline-block;

    margin-top:15px;

    padding:9px 16px;

    border-radius:30px;

    background:#16a34a;

    color:#fff;

    font-size:12px;

    font-weight:bold;
}


/* =====================================================
   BANNER BUTTONS
===================================================== */

.banner-arrow{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:42px;

    height:42px;

    border:0;

    border-radius:50%;

    background:rgba(255,255,255,.92);

    color:#111827;

    font-size:22px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-shadow:
    0 5px 18px rgba(0,0,0,.18);

    z-index:10;
}


.banner-prev{

    left:13px;
}


.banner-next{

    right:13px;
}


/* =====================================================
   DOTS
===================================================== */

.banner-dots{

    position:absolute;

    left:0;

    right:0;

    bottom:13px;

    display:flex;

    justify-content:center;

    gap:7px;

    z-index:10;
}


.banner-dot{

    width:8px;

    height:8px;

    border:0;

    border-radius:50%;

    background:
    rgba(255,255,255,.55);

    cursor:pointer;

    transition:.25s;
}


.banner-dot.active{

    width:24px;

    border-radius:20px;

    background:#fff;
}


/* =====================================================
   MAIN
===================================================== */

.container{

    width:calc(100% - 24px);

    max-width:1250px;

    margin:auto;
}


.section-head{

    margin:25px 0 15px;
}


.section-title{

    font-size:21px;

    font-weight:900;
}


.section-subtitle{

    font-size:11px;

    color:#6b7280;

    margin-top:4px;
}


/* =====================================================
   PRODUCTS
===================================================== */

.products{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:17px;

    padding-bottom:40px;
}


.product{

    background:#fff;

    border:1px solid #e5e7eb;

    border-radius:17px;

    overflow:hidden;

    box-shadow:
    0 4px 16px rgba(15,23,42,.04);

    transition:
    transform .2s,
    box-shadow .2s;
}


.product:hover{

    transform:translateY(-4px);

    box-shadow:
    0 15px 35px rgba(15,23,42,.10);
}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product-image{

    width:100%;

    height:220px;

    background:#f8fafc;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    position:relative;
}


.product-image img{

    width:100%;

    height:100%;

    object-fit:contain;

    padding:10px;

    display:block;
}


/* IMAGE FALLBACK */

.product-fallback{

    width:100%;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

    color:#94a3b8;

    padding:20px;
}


.product-fallback-icon{

    font-size:45px;

    margin-bottom:8px;
}


.product-fallback-text{

    font-size:11px;

    line-height:1.5;
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info{

    padding:13px;
}


.product-title{

    font-size:14px;

    font-weight:800;

    line-height:1.45;

    min-height:40px;

    color:#111827;
}


.product-site{

    margin-top:5px;

    color:#64748b;

    font-size:10px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.buy-button{

    display:block;

    margin-top:11px;

    padding:11px;

    background:

    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:#fff;

    border-radius:9px;

    text-align:center;

    font-size:13px;

    font-weight:800;

    text-decoration:none;
}


.buy-button:active{

    transform:scale(.98);
}


/* =====================================================
   LOADING
===================================================== */

.loading{

    grid-column:1/-1;

    background:#fff;

    border-radius:17px;

    padding:50px 20px;

    text-align:center;

    color:#64748b;

    font-size:13px;
}


.loader{

    width:35px;

    height:35px;

    border:4px solid #e2e8f0;

    border-top-color:#2563eb;

    border-radius:50%;

    margin:0 auto 12px;

    animation:
    spin .8s linear infinite;
}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    grid-column:1/-1;

    background:#fff;

    border-radius:17px;

    padding:55px 20px;

    text-align:center;

    color:#9ca3af;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    background:#0f172a;

    color:#94a3b8;

    text-align:center;

    padding:30px 15px;

    font-size:13px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .products{

        grid-template-columns:
        repeat(3,1fr);
    }

}


@media(max-width:650px){

    .header{

        height:62px;
    }


    .logo{

        font-size:19px;
    }


    .aff-badge{

        font-size:7px;
    }


    .banner-wrapper{

        padding:0 10px;

        margin-top:10px;
    }


    .banner-slider{

        border-radius:17px;
    }


    .banner-slide{

        aspect-ratio:16/8.5;
    }


    .banner-fallback{

        min-height:180px;
    }


    .banner-fallback h1{

        font-size:24px;
    }


    .banner-fallback p{

        font-size:12px;
    }


    .banner-arrow{

        width:34px;

        height:34px;

        font-size:18px;
    }


    .banner-prev{

        left:8px;
    }


    .banner-next{

        right:8px;
    }


    .section-head{

        margin-top:20px;
    }


    .products{

        grid-template-columns:
        repeat(2,1fr);

        gap:11px;
    }


    .product-image{

        height:165px;
    }


    .product-info{

        padding:10px;
    }


    .product-title{

        font-size:13px;
    }


    .buy-button{

        padding:10px;

        font-size:12px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="brand">

        <div class="logo">
            EDVYNOX
        </div>

        <div class="aff-badge">
            AFFILIATE
        </div>

    </div>


    <div class="india-logo">
        🇮🇳
    </div>

</header>



<!-- =====================================================
     BANNER
===================================================== -->

<section class="banner-wrapper">

    <div
        id="bannerSlider"
        class="banner-slider"
    >

        <div
            id="bannerTrack"
            class="banner-track"
        ></div>


        <button
            id="bannerPrev"
            class="banner-arrow banner-prev"
            onclick="previousBanner()"
        >
            ‹
        </button>


        <button
            id="bannerNext"
            class="banner-arrow banner-next"
            onclick="nextBanner()"
        >
            ›
        </button>


        <div
            id="bannerDots"
            class="banner-dots"
        ></div>

    </div>

</section>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">

    <div class="section-head">

        <h2 class="section-title">
            🛍️ हमारे चुनिंदा प्रोडक्ट
        </h2>

        <div class="section-subtitle">
            आपके लिए चुने गए बेहतर Shopping Options
        </div>

    </div>


    <div
        id="products"
        class="products"
    >

        <div class="loading">

            <div class="loader"></div>

            Products लोड हो रहे हैं...

        </div>

    </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    © 2026 EDVYNOX • Affiliate Marketing

</footer>



<script>


/* =====================================================
   🔴🔴🔴 सिर्फ यहीं PRODUCT LINKS डालें 🔴🔴🔴

   आपको NAME नहीं लिखना है।

   सिर्फ Link डालें।

===================================================== */

const PRODUCTS = [

    "https://bitli.in/odQV4yp",

    "https://bitli.in/mdDANqn",

    "https://bitli.in/499Na1U",

    "https://bitli.in/m2tr2QD"

];



/* =====================================================
   BANNERS

   Banner लगाना हो तो नीचे image URL और link डालें।

===================================================== */

const BANNERS = [

    /*
    {
        image:
        "https://example.com/banner.jpg",

        link:
        "https://example.com/"
    }
    */

];



/* =====================================================
   MICROLINK API
===================================================== */

const API =
"https://api.microlink.io/?url=";



/* =====================================================
   GET PRODUCT INFORMATION
===================================================== */

async function getProductInfo(link){

    try{

        const apiURL =
            API +
            encodeURIComponent(link) +
            "&meta=true";


        const response =
            await fetch(apiURL);


        if(!response.ok){

            throw new Error(
                "API Error"
            );

        }


        const result =
            await response.json();


        const data =
            result.data || {};


        let title =
            data.title ||
            data.description ||
            "";


        let image =
            "";


        if(
            data.image
        ){

            if(
                typeof data.image ===
                "string"
            ){

                image =
                    data.image;

            }

            else if(
                data.image.url
            ){

                image =
                    data.image.url;

            }

        }


        let siteName =
            data.siteName ||
            "";


        /*
           अगर title बहुत लंबा है,
           तो उसे थोड़ा साफ करते हैं।
        */

        title =
            cleanTitle(title);


        /*
           अगर title नहीं मिला तो
           short URL को fallback name बनाते हैं।
        */

        if(!title){

            title =
                "आज का शानदार Product";

        }


        return {

            title:title,

            image:image,

            siteName:siteName,

            link:link

        };

    }

    catch(error){

        console.error(
            "Product metadata error:",
            error
        );


        return {

            title:
            "Product देखें",

            image:
            "",

            siteName:
            "",

            link:link

        };

    }

}



/* =====================================================
   CLEAN TITLE
===================================================== */

function cleanTitle(title){

    if(!title){

        return "";

    }


    title =
        String(title)
        .replace(
            /\s+/g,
            " "
        )
        .trim();


    /*
       बहुत ज्यादा generic titles
       हटाने की कोशिश।
    */

    const badTitles = [

        "home",

        "homepage",

        "welcome",

        "untitled",

        "404",

        "not found"

    ];


    if(
        badTitles.includes(
            title.toLowerCase()
        )
    ){

        return "";

    }


    return title;

}



/* =====================================================
   RENDER PRODUCTS
===================================================== */

async function renderProducts(){

    const box =
        document.getElementById(
            "products"
        );


    box.innerHTML = `

        <div class="loading">

            <div class="loader"></div>

            Products लोड हो रहे हैं...

        </div>

    `;


    if(
        PRODUCTS.length === 0
    ){

        box.innerHTML = `

            <div class="empty">

                🛍️

                <br><br>

                अभी कोई Product उपलब्ध नहीं है।

            </div>

        `;

        return;

    }


    /*
       सभी Products एक साथ load होंगे।
    */

    const productData =
        await Promise.all(

            PRODUCTS.map(
                function(link){

                    return getProductInfo(
                        link
                    );

                }
            )

        );


    box.innerHTML = "";


    productData.forEach(
        function(product){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product";


            let imageHTML = `

                <div class="product-fallback">

                    <div class="product-fallback-icon">
                        🛍️
                    </div>

                    <div class="product-fallback-text">

                        Product देखने के लिए
                        Buy Now दबाएं

                    </div>

                </div>

            `;


            if(
                product.image
            ){

                imageHTML = `

                    <img
                        src="${escapeAttribute(product.image)}"
                        alt="${escapeAttribute(product.title)}"
                        loading="lazy"

                        onerror="
                            this.parentElement.innerHTML =
                            '<div class=&quot;product-fallback&quot;><div class=&quot;product-fallback-icon&quot;>🛍️</div><div class=&quot;product-fallback-text&quot;>Product देखने के लिए Buy Now दबाएं</div></div>';
                        "
                    >

                `;

            }


            card.innerHTML = `

                <a
                    href="${escapeAttribute(product.link)}"
                    target="_blank"
                    rel="noopener noreferrer"

                    style="
                        display:block;
                        text-decoration:none;
                    "
                >

                    <div class="product-image">

                        ${imageHTML}

                    </div>

                </a>


                <div class="product-info">

                    <div class="product-title">

                        ${escapeHTML(product.title)}

                    </div>


                    ${
                        product.siteName
                        ?
                        `
                        <div class="product-site">
                            ${escapeHTML(product.siteName)}
                        </div>
                        `
                        :
                        ""
                    }


                    <a
                        class="buy-button"
                        href="${escapeAttribute(product.link)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        🛒 Buy Now

                    </a>

                </div>

            `;


            box.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   BANNERS
===================================================== */

let currentBanner = 0;

let bannerTimer = null;



function renderBanners(){

    const track =
        document.getElementById(
            "bannerTrack"
        );


    const dots =
        document.getElementById(
            "bannerDots"
        );


    track.innerHTML = "";

    dots.innerHTML = "";


    if(
        BANNERS.length === 0
    ){

        track.innerHTML = `

            <div class="banner-slide">

                <div class="banner-fallback">

                    <div>

                        <h1>
                            आपकी पसंद, हमारी खोज! 🛍️
                        </h1>

                        <p>
                            पसंदीदा प्रोडक्ट खोजें,
                            बेहतर विकल्प देखें
                            और अपनी खरीदारी आसानी से करें।
                        </p>

                        <span class="banner-badge">

                            ✨ स्मार्ट शॉपिंग • आसान खरीदारी

                        </span>

                    </div>

                </div>

            </div>

        `;


        document
        .getElementById("bannerPrev")
        .style.display =
            "none";


        document
        .getElementById("bannerNext")
        .style.display =
            "none";


        return;

    }


    BANNERS.forEach(
        function(banner,index){

            const slide =
                document.createElement(
                    "div"
                );


            slide.className =
                "banner-slide";


            if(
                banner.link
            ){

                slide.innerHTML = `

                    <a
                        href="${escapeAttribute(banner.link)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <img
                            src="${escapeAttribute(banner.image)}"
                            alt="EDVYNOX Banner"
                        >

                    </a>

                `;

            }

            else{

                slide.innerHTML = `

                    <img
                        src="${escapeAttribute(banner.image)}"
                        alt="EDVYNOX Banner"
                    >

                `;

            }


            track.appendChild(
                slide
            );


            const dot =
                document.createElement(
                    "button"
                );


            dot.className =
                "banner-dot";


            if(
                index === 0
            ){

                dot.classList.add(
                    "active"
                );

            }


            dot.onclick =
                function(){

                    goToBanner(index);

                };


            dots.appendChild(
                dot
            );

        }
    );


    currentBanner = 0;


    updateBannerPosition();


    document
    .getElementById("bannerPrev")
    .style.display =
        BANNERS.length > 1
        ? "flex"
        : "none";


    document
    .getElementById("bannerNext")
    .style.display =
        BANNERS.length > 1
        ? "flex"
        : "none";


    startBannerAutoPlay();

}



function updateBannerPosition(){

    const track =
        document.getElementById(
            "bannerTrack"
        );


    track.style.transform =
        "translateX(-" +
        (
            currentBanner * 100
        ) +
        "%)";


    document
    .querySelectorAll(
        ".banner-dot"
    )
    .forEach(
        function(dot,index){

            dot.classList.toggle(
                "active",
                index === currentBanner
            );

        }
    );

}



function nextBanner(){

    if(
        BANNERS.length <= 1
    ){

        return;

    }


    currentBanner =
        (
            currentBanner + 1
        ) %
        BANNERS.length;


    updateBannerPosition();

}



function previousBanner(){

    if(
        BANNERS.length <= 1
    ){

        return;

    }


    currentBanner =
        (
            currentBanner -
            1 +
            BANNERS.length
        ) %
        BANNERS.length;


    updateBannerPosition();

}



function goToBanner(index){

    currentBanner =
        index;

    updateBannerPosition();

}



function startBannerAutoPlay(){

    clearInterval(
        bannerTimer
    );


    if(
        BANNERS.length <= 1
    ){

        return;

    }


    bannerTimer =
        setInterval(
            function(){

                nextBanner();

            },
            4000
        );

}



/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHTML(
        value
    );

}



/* =====================================================
   START WEBSITE
===================================================== */

renderBanners();

renderProducts();


</script>

</body>

</html>
