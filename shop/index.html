<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Mobile Responsive -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Best Deals & Offers</title>

  <meta name="description"
        content="Latest online deals, discounts and offers">

  <meta name="theme-color"
        content="#111827">

  <!-- Preconnect = Faster Loading -->
  <link rel="preconnect"
        href="https://inrdeals.com">

  <link rel="dns-prefetch"
        href="//inrdeals.com">


  <style>

    /* =====================================
       RESET
    ===================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      width: 100%;

      min-height: 100vh;

      background: #f3f4f6;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #111827;

      overflow-x: hidden;

    }


    /* =====================================
       HEADER
    ===================================== */

    .top-header {

      width: 100%;

      background:
        linear-gradient(
          135deg,
          #111827,
          #1f2937
        );

      color: white;

      padding: 16px 20px;

      text-align: center;

      box-shadow:
        0 2px 12px
        rgba(0,0,0,0.15);

      position: sticky;

      top: 0;

      z-index: 1000;

    }


    .top-header h1 {

      font-size: 22px;

      font-weight: 700;

      line-height: 1.3;

    }


    .top-header p {

      margin-top: 5px;

      font-size: 13px;

      opacity: .85;

    }


    /* =====================================
       MAIN CONTAINER
    ===================================== */

    .main {

      width: 100%;

      max-width: 1440px;

      margin: auto;

      padding: 15px;

    }


    /* =====================================
       DEALS BOX
    ===================================== */

    .deals-box {

      width: 100%;

      background: #fff;

      border-radius: 12px;

      overflow: hidden;

      box-shadow:
        0 3px 18px
        rgba(0,0,0,0.08);

    }


    /* =====================================
       LOADING SCREEN
    ===================================== */

    .loading {

      width: 100%;

      min-height: 100px;

      display: flex;

      justify-content: center;

      align-items: center;

      text-align: center;

      font-size: 14px;

      color: #666;

      background: #fff;

    }


    .loader {

      width: 24px;

      height: 24px;

      border: 3px solid #ddd;

      border-top: 3px solid #111827;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

      margin-right: 10px;

    }


    @keyframes spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    /* =====================================
       INRDEALS FRAME
    ===================================== */

    .inrdeals-frame {

      display: block;

      width: 100%;

      min-height: 1140px;

      height: 1140px;

      border: 0;

      background: #fff;

    }


    /* =====================================
       MOBILE
    ===================================== */

    @media (max-width: 600px) {

      .top-header {

        padding: 13px 10px;

      }


      .top-header h1 {

        font-size: 19px;

      }


      .top-header p {

        font-size: 12px;

      }


      .main {

        padding: 5px;

      }


      .deals-box {

        border-radius: 7px;

      }


      .inrdeals-frame {

        min-height: 1140px;

        height: 1140px;

      }

    }


    /* =====================================
       TABLET
    ===================================== */

    @media (min-width: 601px)
       and (max-width: 999px) {

      .main {

        padding: 10px;

      }

      .inrdeals-frame {

        min-height: 1140px;

        height: 1140px;

      }

    }


    /* =====================================
       DESKTOP
    ===================================== */

    @media (min-width: 1000px) {

      .main {

        padding: 20px;

      }


      .deals-box {

        border-radius: 12px;

      }


      .inrdeals-frame {

        min-height: 1140px;

        height: 1140px;

      }

    }


  </style>

</head>


<body>


  <!-- =====================================
       HEADER
  ====================================== -->

  <header class="top-header">

    <h1>
      🔥 Best Deals & Offers
    </h1>

    <p>
      Latest Deals • Discounts • Cashback Offers
    </p>

  </header>



  <!-- =====================================
       MAIN
  ====================================== -->

  <main class="main">


    <section class="deals-box">


      <!-- Loading -->

      <div
        class="loading"
        id="loading">

        <span class="loader"></span>

        <span>
          Deals Loading...
        </span>

      </div>



      <!-- =====================================
           INRDEALS
      ====================================== -->

      <iframe

        id="dealsFrame"

        class="inrdeals-frame"

        src="https://inrdeals.com/embed/deals?user=arm532515116"

        title="Latest Deals and Offers"

        frameborder="0"

        loading="eager"

        allowtransparency="true"

        referrerpolicy="strict-origin-when-cross-origin">

      </iframe>


    </section>


  </main>



  <!-- =====================================
       JAVASCRIPT
  ====================================== -->

  <script>

    const iframe =
      document.getElementById("dealsFrame");

    const loading =
      document.getElementById("loading");


    /*
      iframe load होने के बाद
      loading message हट जाएगा
    */

    iframe.addEventListener(
      "load",
      function () {

        loading.style.display = "none";

      }
    );


    /*
      अगर iframe load न हो पाए
      तो 12 सेकंड बाद loading हटाएं
    */

    setTimeout(
      function () {

        if (loading) {

          loading.style.display = "none";

        }

      },
      12000
    );


  </script>


</body>
</html>
