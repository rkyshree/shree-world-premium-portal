<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHRAYNEX Employee Management</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#080d18;
    color:#fff;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* ================= LOGIN ================= */

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    radial-gradient(circle at top,#243d78 0,#080d18 55%);
}

.login-box{
    width:100%;
    max-width:420px;

    background:#111a2b;
    border:1px solid #263756;

    padding:30px;
    border-radius:22px;

    box-shadow:0 25px 70px #0009;
}

.logo{
    text-align:center;
    font-size:31px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#4d9aff;
}

.login-title{
    text-align:center;
    margin-top:8px;
    color:#91a2c2;
    margin-bottom:25px;
}

.login-tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.login-tabs button{
    flex:1;
    padding:11px;
    border:0;
    border-radius:10px;
    background:#202d47;
    color:#aebbd0;
}

.login-tabs button.active{
    background:#287cff;
    color:#fff;
}

label{
    display:block;
    margin-top:14px;
    color:#b8c5db;
    font-size:14px;
}

input,
textarea,
select{
    width:100%;
    margin-top:7px;

    background:#0b1220;
    color:#fff;

    border:1px solid #2b3b5a;

    padding:12px;
    border-radius:10px;

    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.btn{
    border:0;
    border-radius:10px;

    background:#287cff;
    color:#fff;

    padding:12px 16px;

    font-weight:700;
}

.btn:hover{
    opacity:.9;
}

.btn-success{
    background:#159957;
}

.btn-warning{
    background:#d99100;
}

.btn-danger{
    background:#e53945;
}

.btn-dark{
    background:#303d57;
}

.full{
    width:100%;
    margin-top:20px;
}

.error{
    text-align:center;
    color:#ff6e79;
    margin-top:15px;
    font-size:14px;
}


/* ================= APP ================= */

.app{
    min-height:100vh;
}

.sidebar{
    width:250px;

    position:fixed;
    top:0;
    bottom:0;
    left:0;

    background:#10192a;
    border-right:1px solid #263756;

    padding:20px;

    z-index:100;
}

.sidebar-logo{
    font-size:25px;
    font-weight:900;
    margin-bottom:30px;
}

.sidebar-logo span{
    color:#4d9aff;
}

.nav-btn{
    width:100%;
    border:0;

    background:transparent;
    color:#aebbd0;

    text-align:left;

    padding:13px;
    border-radius:10px;

    margin-bottom:8px;
}

.nav-btn:hover,
.nav-btn.active{
    background:#203254;
    color:#fff;
}

.main{
    margin-left:250px;
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:25px;
}

.topbar h1{
    font-size:25px;
}

.user{
    color:#91a2c2;
    font-size:13px;
    margin-top:5px;
}


/* ================= CARDS ================= */

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;

    margin-bottom:20px;
}

.card{
    background:#111a2b;
    border:1px solid #263756;

    border-radius:16px;
    padding:20px;
}

.card small{
    color:#91a2c2;
}

.card h2{
    margin-top:8px;
    font-size:28px;
}


/* ================= SECTION ================= */

.section{
    background:#111a2b;
    border:1px solid #263756;

    border-radius:16px;

    padding:20px;
    margin-bottom:20px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;

    margin-bottom:18px;
}

.section-head h2{
    font-size:19px;
}


/* ================= TABLE ================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,
td{
    padding:13px;

    border-bottom:1px solid #263756;

    text-align:left;

    font-size:14px;
}

th{
    color:#91a2c2;
}

.badge{
    display:inline-block;

    background:#263756;

    padding:6px 10px;

    border-radius:20px;

    font-size:12px;
}

.badge.green{
    background:#135d3c;
}

.badge.orange{
    background:#674700;
}

.badge.blue{
    background:#194b8e;
}

.empty{
    text-align:center;
    color:#74839f;
    padding:25px;
}


/* ================= TASK CARDS ================= */

.task-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.task-card{
    background:#0d1524;
    border:1px solid #293a59;

    padding:18px;
    border-radius:15px;
}

.task-card h3{
    margin-bottom:8px;
}

.task-description{
    color:#9aa9c1;
    line-height:1.5;
    margin:10px 0;
}

.task-money{
    font-size:22px;
    font-weight:800;
    margin:10px 0;
}

.task-meta{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:12px;
}

.task-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}


/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;

    background:#000b;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    z-index:999;
}

.modal-box{
    width:100%;
    max-width:600px;

    max-height:90vh;
    overflow:auto;

    background:#111a2b;

    border:1px solid #30415f;

    border-radius:18px;

    padding:25px;
}

.modal-head{
    display:flex;
    justify-content:space-between;

    align-items:center;

    margin-bottom:10px;
}

.close{
    border:0;

    width:35px;
    height:35px;

    border-radius:50%;

    background:#2d3b55;

    color:#fff;

    font-size:20px;
}


/* ================= EMPLOYEE ID ================= */

.generated-id{
    background:#0a1323;
    border:1px dashed #418cff;

    padding:15px;

    border-radius:12px;

    margin-top:15px;

    text-align:center;
}

.generated-id strong{
    display:block;

    font-size:25px;

    color:#4d9aff;

    margin-top:5px;
}


/* ================= MOBILE ================= */

.mobile-menu{
    display:none;

    border:0;
    background:#293a59;
    color:#fff;

    padding:9px 12px;

    border-radius:9px;
}

@media(max-width:900px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        padding:15px;
    }

    .mobile-menu{
        display:inline-block;
        margin-right:8px;
    }

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .task-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:550px){

    .cards{
        grid-template-columns:1fr;
    }

    .topbar{
        align-items:flex-start;
    }

    .topbar h1{
        font-size:20px;
    }

    .login-box{
        padding:22px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="logo">
            SHRAY<span>NEX</span>
        </div>

        <div class="login-title">
            Employee Management System
        </div>


        <div class="login-tabs">

            <button
                id="ownerTab"
                class="active"
                onclick="setLoginType('owner')">

                Owner

            </button>

            <button
                id="employeeTab"
                onclick="setLoginType('employee')">

                Employee

            </button>

        </div>


        <!-- OWNER LOGIN -->

        <div id="ownerLogin">

            <label>Owner Email</label>

            <input
                id="ownerEmail"
                type="email"
                placeholder="Owner email">


            <label>Password</label>

            <input
                id="ownerPassword"
                type="password"
                placeholder="Owner password">


            <button
                class="btn full"
                onclick="ownerLogin()">

                Owner Login

            </button>

        </div>


        <!-- EMPLOYEE LOGIN -->

        <div id="employeeLogin" class="hidden">

            <label>Employee ID</label>

            <input
                id="employeeId"
                placeholder="Example: RAJ1215"
                style="text-transform:uppercase">


            <label>Password</label>

            <input
                id="employeePassword"
                type="password"
                placeholder="Mobile के पहले 5 अंक">


            <button
                class="btn full"
                onclick="employeeLogin()">

                Employee Login

            </button>

        </div>


        <div id="loginError" class="error"></div>

    </div>

</div>



<!-- =====================================================
     APP
===================================================== -->

<div id="app" class="app hidden">


    <!-- SIDEBAR -->

    <aside id="sidebar" class="sidebar">

        <div class="sidebar-logo">
            SHRAY<span>NEX</span>
        </div>


        <button
            class="nav-btn active"
            onclick="showPage('dashboard')">

            📊 Dashboard

        </button>


        <button
            id="employeeNav"
            class="nav-btn"
            onclick="showPage('employees')">

            👥 Employees

        </button>


        <button
            class="nav-btn"
            onclick="showPage('tasks')">

            ✅ Tasks

        </button>


        <button
            class="nav-btn"
            onclick="showPage('payments')">

            💰 My Payments

        </button>


        <button
            class="nav-btn"
            onclick="logout()">

            🚪 Logout

        </button>

    </aside>



    <!-- MAIN -->

    <main class="main">


        <div class="topbar">

            <div>

                <button
                    class="mobile-menu"
                    onclick="toggleSidebar()">

                    ☰

                </button>

                <h1 id="pageTitle">
                    Dashboard
                </h1>

                <div
                    id="userInfo"
                    class="user">
                </div>

            </div>


            <button
                class="btn btn-dark"
                onclick="location.reload()">

                ↻

            </button>

        </div>



        <!-- =================================================
             DASHBOARD
        ================================================= -->

        <section id="dashboardPage">


            <div class="cards">


                <div class="card">

                    <small>
                        Total Tasks
                    </small>

                    <h2 id="totalTasks">
                        0
                    </h2>

                </div>


                <div class="card">

                    <small>
                        Pending
                    </small>

                    <h2 id="pendingTasks">
                        0
                    </h2>

                </div>


                <div class="card">

                    <small>
                        Completed
                    </small>

                    <h2 id="completedTasks">
                        0
                    </h2>

                </div>


                <div class="card">

                    <small>
                        My Earnings
                    </small>

                    <h2 id="totalEarnings">
                        ₹0
                    </h2>

                </div>

            </div>


            <!-- OWNER STATS -->

            <div
                id="ownerStats"
                class="cards hidden">


                <div class="card">

                    <small>
                        Employees
                    </small>

                    <h2 id="employeeCount">
                        0
                    </h2>

                </div>


                <div class="card">

                    <small>
                        Paid Amount
                    </small>

                    <h2 id="paidAmount">
                        ₹0
                    </h2>

                </div>


                <div class="card">

                    <small>
                        Pending Payment
                    </small>

                    <h2 id="pendingPayment">
                        ₹0
                    </h2>

                </div>


            </div>


            <div class="section">

                <div class="section-head">

                    <h2>
                        Recent Tasks
                    </h2>

                </div>

                <div
                    id="recentTasks"
                    class="task-grid">
                </div>

            </div>


        </section>



        <!-- =================================================
             EMPLOYEES
        ================================================= -->

        <section
            id="employeesPage"
            class="hidden">


            <div class="section">

                <div class="section-head">

                    <h2>
                        Employees
                    </h2>

                    <button
                        class="btn"
                        onclick="openEmployeeModal()">

                        + Add Employee

                    </button>

                </div>


                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>

                                <th>Name</th>

                                <th>Employee ID</th>

                                <th>Phone</th>

                                <th>Role</th>

                                <th>Salary</th>

                                <th>Status</th>

                            </tr>

                        </thead>


                        <tbody id="employeeTable">
                        </tbody>

                    </table>

                </div>

            </div>


        </section>



        <!-- =================================================
             TASKS
        ================================================= -->

        <section
            id="tasksPage"
            class="hidden">


            <div class="section">

                <div class="section-head">

                    <h2>
                        Tasks
                    </h2>

                    <button
                        id="assignTaskBtn"
                        class="btn"
                        onclick="openTaskModal()">

                        + Assign Task

                    </button>

                </div>


                <div
                    id="taskGrid"
                    class="task-grid">
                </div>

            </div>


        </section>



        <!-- =================================================
             PAYMENTS
        ================================================= -->

        <section
            id="paymentsPage"
            class="hidden">


            <div class="section">

                <div class="section-head">

                    <h2>
                        Payment History
                    </h2>

                </div>


                <div class="table-wrap">

                    <table>

                        <thead>

                            <tr>

                                <th>Task</th>

                                <th>Amount</th>

                                <th>Status</th>

                                <th>Date</th>

                            </tr>

                        </thead>


                        <tbody id="paymentTable">
                        </tbody>

                    </table>

                </div>

            </div>


        </section>


    </main>

</div>



<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="modal"
    class="modal hidden">


    <div class="modal-box">

        <div class="modal-head">

            <h2 id="modalTitle">
                Add
            </h2>

            <button
                class="close"
                onclick="closeModal()">

                ×

            </button>

        </div>


        <div id="modalBody">
        </div>

    </div>

</div>



<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp,
    getApps
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    addDoc,
    updateDoc,
    onSnapshot,
    query,
    where,
    serverTimestamp,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =====================================================
   YOUR FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};



/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;

let currentRole = null;

let currentProfile = null;

let employees = [];

let tasks = [];

let payments = [];

let loginType = "owner";



/* =====================================================
   LOGIN TYPE
===================================================== */

window.setLoginType =
function(type){

    loginType = type;


    document
        .getElementById("ownerLogin")
        .classList.toggle(
            "hidden",
            type !== "owner"
        );


    document
        .getElementById("employeeLogin")
        .classList.toggle(
            "hidden",
            type !== "employee"
        );


    document
        .getElementById("ownerTab")
        .classList.toggle(
            "active",
            type === "owner"
        );


    document
        .getElementById("employeeTab")
        .classList.toggle(
            "active",
            type === "employee"
        );


    document
        .getElementById("loginError")
        .textContent = "";

};



/* =====================================================
   OWNER LOGIN
===================================================== */

window.ownerLogin =
async function(){

    const email =
        document
        .getElementById("ownerEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("ownerPassword")
        .value;


    if(!email || !password){

        showLoginError(
            "Email और Password भरें।"
        );

        return;
    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(error);

        showLoginError(
            "Owner login failed."
        );

    }

};



/* =====================================================
   EMPLOYEE LOGIN
===================================================== */

window.employeeLogin =
async function(){

    const id =
        document
        .getElementById("employeeId")
        .value
        .trim()
        .toUpperCase();


    const password =
        document
        .getElementById("employeePassword")
        .value;


    if(!id || !password){

        showLoginError(
            "Employee ID और Password भरें।"
        );

        return;
    }


    try{

        /*
          Employee ID को
          Firebase internal email में बदला जा रहा है.
        */

        const email =
            id.toLowerCase()
            + "@employee.shraynex.local";


        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


    }catch(error){

        console.error(error);

        showLoginError(
            "गलत Employee ID या Password."
        );

    }

};



/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            document
                .getElementById("loginPage")
                .classList.remove("hidden");

            document
                .getElementById("app")
                .classList.add("hidden");

            return;
        }


        currentUser = user;


        await loadProfile();

    }
);



/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

    const ref =
        doc(
            db,
            "users",
            currentUser.uid
        );


    const snap =
        await getDoc(ref);


    if(!snap.exists()){

        alert(
            "User profile नहीं मिला।"
        );

        await signOut(auth);

        return;
    }


    currentProfile =
        snap.data();


    currentRole =
        currentProfile.role;


    document
        .getElementById("loginPage")
        .classList.add("hidden");


    document
        .getElementById("app")
        .classList.remove("hidden");


    document
        .getElementById("userInfo")
        .textContent =
        `${currentProfile.name} • ${
            currentRole === "owner"
            ? "OWNER"
            : "EMPLOYEE"
        }`;


    setupRole();


    startRealtime();

}



/* =====================================================
   ROLE SETUP
===================================================== */

function setupRole(){

    const owner =
        currentRole === "owner";


    document
        .getElementById("employeeNav")
        .style.display =
        owner ? "block" : "none";


    document
        .getElementById("ownerStats")
        .classList.toggle(
            "hidden",
            !owner
        );


    document
        .getElementById("assignTaskBtn")
        .style.display =
        owner ? "block" : "none";

}



/* =====================================================
   REALTIME DATA
===================================================== */

function startRealtime(){


    /*
      EMPLOYEES
    */

    onSnapshot(
        collection(db,"users"),
        snapshot => {

            employees =
                snapshot.docs
                .map(d => ({
                    id:d.id,
                    ...d.data()
                }))
                .filter(
                    e =>
                    e.role === "employee"
                );


            renderEmployees();

            updateDashboard();

        }
    );



    /*
      TASKS
    */

    if(currentRole === "owner"){

        onSnapshot(
            collection(db,"tasks"),
            snapshot => {

                tasks =
                    snapshot.docs
                    .map(d => ({
                        id:d.id,
                        ...d.data()
                    }));


                renderTasks();

                renderRecentTasks();

                updateDashboard();

            }
        );

    }else{

        const q =
            query(
                collection(db,"tasks"),
                where(
                    "employeeId",
                    "==",
                    currentUser.uid
                )
            );


        onSnapshot(
            q,
            snapshot => {

                tasks =
                    snapshot.docs
                    .map(d => ({
                        id:d.id,
                        ...d.data()
                    }));


                renderTasks();

                renderRecentTasks();

                updateDashboard();

            }
        );

    }



    /*
      PAYMENTS
    */

    if(currentRole === "owner"){

        onSnapshot(
            collection(db,"payments"),
            snapshot => {

                payments =
                    snapshot.docs
                    .map(d => ({
                        id:d.id,
                        ...d.data()
                    }));


                renderPayments();

                updateDashboard();

            }
        );

    }else{

        const q =
            query(
                collection(db,"payments"),
                where(
                    "employeeId",
                    "==",
                    currentUser.uid
                )
            );


        onSnapshot(
            q,
            snapshot => {

                payments =
                    snapshot.docs
                    .map(d => ({
                        id:d.id,
                        ...d.data()
                    }));


                renderPayments();

                updateDashboard();

            }
        );

    }

}



/* =====================================================
   EMPLOYEES
===================================================== */

function renderEmployees(){

    const tbody =
        document
        .getElementById("employeeTable");


    if(!tbody) return;


    if(!employees.length){

        tbody.innerHTML =
        `
        <tr>
            <td colspan="6"
                class="empty">
                अभी कोई employee नहीं है।
            </td>
        </tr>
        `;

        return;
    }


    tbody.innerHTML =
        employees
        .map(e => `

        <tr>

            <td>
                ${safe(e.name)}
            </td>

            <td>
                <b>
                    ${safe(e.employeeId)}
                </b>
            </td>

            <td>
                ${safe(e.phone)}
            </td>

            <td>
                ${safe(e.jobRole)}
            </td>

/* =====================================================
   CREATE EMPLOYEE
===================================================== */

window.createEmployee =
async function(){

    const name =
        document
        .getElementById("newName")
        .value
        .trim();


    const phone =
        document
        .getElementById("newPhone")
        .value
        .trim();


    const jobRole =
        document
        .getElementById("newJobRole")
        .value
        .trim();


    const salary =
        Number(
            document
            .getElementById("newSalary")
            .value || 0
        );


    if(name.length < 3){

        alert(
            "कम से कम 3 अक्षर का नाम डालें।"
        );

        return;
    }


    if(!/^\d{10}$/.test(phone)){

        alert(
            "10 digit mobile number डालें।"
        );

        return;
    }


    const cleanName =
        name
        .replace(
            /[^a-zA-Z]/g,
            ""
        );


    const employeeId =
        cleanName
        .substring(0,3)
        .toUpperCase()
        + "1215";


    const password =
        phone.substring(0,5);


    const email =
        employeeId.toLowerCase()
        + "@employee.shraynex.local";


    try{


        /*
          Secondary Auth

          Owner logout नहीं होगा.
        */

        const secondaryApp =
            getApps().find(
                a =>
                a.name === "EmployeeCreationApp"
            )
            ||
            initializeApp(
                firebaseConfig,
                "EmployeeCreationApp"
            );


        const secondaryAuth =
            getAuth(
                secondaryApp
            );


        /*
          Firebase Account
        */

        const credential =
            await createUserWithEmailAndPassword(
                secondaryAuth,
                email,
                password
            );


        /*
          Firestore Profile
        */

        await setDoc(
            doc(
                db,
                "users",
                credential.user.uid
            ),
            {

                name:name,

                employeeId:employeeId,

                email:email,

                phone:phone,

                jobRole:jobRole,

                salary:salary,

                role:"employee",

                status:"Active",

                createdAt:
                    serverTimestamp()

            }
        );


        await signOut(
            secondaryAuth
        );


        closeModal();


        alert(
            `Employee Successfully Created!

ID: ${employeeId}
Password: ${password}

यह ID और Password employee को दें।`
        );


    }catch(error){

        console.error(error);

        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            alert(
                "यह Employee ID पहले से मौजूद है।"
            );

        }else{

            alert(
                "Employee create failed:\n"
                + error.message
            );

        }

    }

};

/* =====================================================
   TASK BUTTONS
===================================================== */

function taskButtons(t){

    if(currentRole === "owner"){

        if(
            t.status === "Completed"
            &&
            t.paymentStatus !== "Paid"
        ){

            return `

                <button
                    class="btn btn-success"
                    onclick="payTask('${t.id}')">

                    💰 Mark Payment Paid

                </button>

            `;

        }


        return `

            <span class="badge">
                ${safe(
                    t.status || "Assigned"
                )}
            </span>

        `;

    }


    /* EMPLOYEE */

    if(t.status === "Assigned"){

        return `

            <button
                class="btn"
                onclick="startTask('${t.id}')">

                ▶ Start Working

            </button>

        `;

    }


    if(t.status === "Working"){

        return `

            <button
                class="btn btn-success"
                onclick="submitTask('${t.id}')">

                ✓ Submit Task

            </button>

        `;

    }


    if(t.status === "Completed"){

        return `

            <span class="badge green">
                ✓ Submitted — Payment Pending
            </span>

        `;

    }


    return "";

}



/* =====================================================
   START TASK
===================================================== */

window.startTask =
async function(taskId){

    try{

        await runTransaction(
            db,
            async transaction => {

                const taskRef =
                    doc(
                        db,
                        "tasks",
                        taskId
                    );


                const snap =
                    await transaction.get(
                        taskRef
                    );


                if(!snap.exists()){

                    throw new Error(
                        "Task नहीं मिला।"
                    );

                }


                const task =
                    snap.data();


                /*
                  सिर्फ assigned employee
                  ही task start कर सकता है.
                */

                if(
                    task.employeeId
                    !==
                    currentUser.uid
                ){

                    throw new Error(
                        "यह task आपके लिए नहीं है।"
                    );

                }


                if(
                    task.status !==
                    "Assigned"
                ){

                    throw new Error(
                        "यह task पहले ही start हो चुका है।"
                    );

                }


                transaction.update(
                    taskRef,
                    {

                        status:"Working",

                        startedAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }
                );

            }
        );


        alert(
            "Task Working में चला गया।"
        );


    }catch(error){

        alert(
            error.message
        );

    }

};



/* =====================================================
   SUBMIT TASK
===================================================== */

window.submitTask =
async function(taskId){

    const confirmSubmit =
        confirm(
            "क्या आपने यह task पूरा कर लिया है?"
        );


    if(!confirmSubmit)
        return;


    try{

        await runTransaction(
            db,
            async transaction => {

                const taskRef =
                    doc(
                        db,
                        "tasks",
                        taskId
                    );


                const snap =
                    await transaction.get(
                        taskRef
                    );


                if(!snap.exists()){

                    throw new Error(
                        "Task नहीं मिला।"
                    );

                }


                const task =
                    snap.data();


                if(
                    task.employeeId
                    !==
                    currentUser.uid
                ){

                    throw new Error(
                        "यह task आपका नहीं है।"
                    );

                }


                if(
                    task.status !==
                    "Working"
                ){

                    throw new Error(
                        "Task Working status में नहीं है।"
                    );

                }


                transaction.update(
                    taskRef,
                    {

                        status:"Completed",

                        paymentStatus:
                            "Pending",

                        completedAt:
                            serverTimestamp(),

                        updatedAt:
                            serverTimestamp()

                    }
                );

            }
        );


        alert(
            "Task successfully submit हो गया।"
        );


    }catch(error){

        alert(
            error.message
        );

    }

};



/* =====================================================
   OWNER PAYMENT
===================================================== */

window.payTask =
async function(taskId){

    if(currentRole !== "owner")
        return;


    try{

        const taskRef =
            doc(
                db,
                "tasks",
                taskId
            );


        const taskSnap =
            await getDoc(taskRef);


        if(!taskSnap.exists()){

            alert(
                "Task नहीं मिला।"
            );

            return;
        }


        const task =
            taskSnap.data();


        if(
            task.status !==
            "Completed"
        ){

            alert(
                "Employee ने अभी task submit नहीं किया है।"
            );

            return;
        }


        if(
            task.paymentStatus ===
            "Paid"
        ){

            alert(
                "Payment पहले ही paid है।"
            );

            return;
        }


        await updateDoc(
            taskRef,
            {

                paymentStatus:"Paid",

                paidAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            }
        );


        /*
          Payment record
        */

        await addDoc(
            collection(db,"payments"),
            {

                taskId:taskId,

                taskName:task.name,

                employeeId:
                    task.employeeId,

                amount:
                    task.amount,

                status:"Paid",

                paidAt:
                    serverTimestamp()

            }
        );


        alert(
            "Payment Paid mark कर दिया गया।"
        );


    }catch(error){

        console.error(error);

        alert(
            "Payment update failed."
        );

    }

};

/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){

    const total =
        tasks.length;


    const pending =
        tasks.filter(
            t =>
            t.status === "Assigned"
            ||
            t.status === "Working"
        ).length;


    const completed =
        tasks.filter(
            t =>
            t.status === "Completed"
        ).length;


    const earnings =
        tasks
        .filter(
            t =>
            t.paymentStatus === "Paid"
        )
        .reduce(
            (sum,t) =>
            sum +
            Number(t.amount || 0),
            0
        );


    document
        .getElementById("totalTasks")
        .textContent =
        total;


    document
        .getElementById("pendingTasks")
        .textContent =
        pending;


    document
        .getElementById("completedTasks")
        .textContent =
        completed;


    document
        .getElementById("totalEarnings")
        .textContent =
        money(earnings);


    if(currentRole === "owner"){

        const paid =
            payments
            .reduce(
                (sum,p) =>
                sum +
                Number(
                    p.amount || 0
                ),
                0
            );


        const pendingPay =
            tasks
            .filter(
                t =>
                t.status === "Completed"
                &&
                t.paymentStatus !== "Paid"
            )
            .reduce(
                (sum,t) =>
                sum +
                Number(
                    t.amount || 0
                ),
                0
            );


        document
            .getElementById("employeeCount")
            .textContent =
            employees.length;


        document
            .getElementById("paidAmount")
            .textContent =
            money(paid);


        document
            .getElementById("pendingPayment")
            .textContent =
            money(pendingPay);

    }

}

/* =====================================================
   HELPERS
===================================================== */

function money(value){

    return "₹" +
        Number(value || 0)
        .toLocaleString("en-IN");

}


function safe(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function showLoginError(message){

    document
        .getElementById("loginError")
        .textContent =
        message;

}
