<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box; /* Input को बॉक्स के अंदर रखने के लिए */
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0d6efd;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0b5ed7;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Track Your Order</h2>
        <input type="text" id="orderId" placeholder="Enter Order ID">
        <button onclick="trackOrder()">Track Order</button>
        <div id="result"></div>
    </div>

    <!-- Script को Body के अंत में रखना सबसे सही होता है -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

        // सही Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCOMp4Z4XncCXCLiKb3OwsqkAMe2oFSd2I",
            authDomain: "rkyshree-2f74b.firebaseapp.com",
            projectId: "rkyshree-2f74b",
            storageBucket: "rkyshree-2f74b.firebasestorage.app",
            messagingSenderId: "354823113610",
            appId: "1:354823113610:web:d043805305c945339c9673",
            measurementId: "G-WSXGTGFWYK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // function को window object में रखा गया है ताकि HTML button इसे कॉल कर सके
        window.trackOrder = async () => {
            const id = document.getElementById("orderId").value.trim();

            if (id === "") {
                alert("Enter Order ID");
                return;
            }

            document.getElementById("result").innerHTML = "Loading...";

            try {
                const snap = await getDoc(doc(db, "orders", id));

                if (!snap.exists()) {
                    document.getElementById("result").innerHTML = "❌ Order Not Found";
                    return;
                }

                const data = snap.data();
                document.getElementById("result").innerHTML = `
                    <h3>${data.service || 'Service Name Unavailable'}</h3>
                    <p>Status : <b>${data.status || 'N/A'}</b></p>
                    <p>Amount : ₹${data.amount || '0'}</p>
                `;
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById("result").innerHTML = "❌ Some error occurred. Please try again.";
            }
        };
    </script>
</body>
</html>
